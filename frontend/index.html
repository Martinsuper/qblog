<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QBlog · 私人知识库</title>
    <script>
      // 首屏前应用主题，避免暗色模式闪白
      (function () {
        var theme = localStorage.getItem('theme')
        var dark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
    <style>
      /* 应用挂载前的骨架屏：覆盖 JS 包下载与首路由解析的白屏期。
         #app 保持空节点，挂载后 :empty 不再匹配，骨架自动消失。 */
      #app:empty::after {
        content: '';
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle 4px at calc(50% - 14px) calc(50% + 22px), #365b68 96%, transparent),
          radial-gradient(circle 4px at 50% calc(50% + 22px), #365b68 96%, transparent),
          radial-gradient(circle 4px at calc(50% + 14px) calc(50% + 22px), #365b68 96%, transparent),
          #f7f8fa;
        animation: app-skeleton-pulse 1.2s infinite ease-in-out;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      #app:empty::before {
        content: 'QBlog';
        position: fixed;
        top: calc(50% - 34px);
        left: 0;
        right: 0;
        text-align: center;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.12em;
        color: #365b68;
        z-index: 1;
      }
      [data-theme='dark'] #app:empty::after {
        background:
          radial-gradient(circle 4px at calc(50% - 14px) calc(50% + 22px), #7fa8b8 96%, transparent),
          radial-gradient(circle 4px at 50% calc(50% + 22px), #7fa8b8 96%, transparent),
          radial-gradient(circle 4px at calc(50% + 14px) calc(50% + 22px), #7fa8b8 96%, transparent),
          #14181f;
      }
      [data-theme='dark'] #app:empty::before { color: #7fa8b8; }
      @keyframes app-skeleton-pulse {
        0%, 80%, 100% { opacity: 1; }
        40% { opacity: 0.55; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
