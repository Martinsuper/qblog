user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # gzip 压缩
    gzip  on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 上游：后端服务（compose 网络内的容器名）
    upstream qblog_backend {
        server qblog-backend:8081;
    }

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # 仅备份导入允许大请求；保留 /api 前缀以匹配后端 context-path。
        location = /api/backup/import {
            client_max_body_size 101m;
            proxy_pass http://qblog_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # 给 5 MiB 图片留出 multipart 包装空间，文件本身由后端严格校验。
        location = /api/upload/image {
            client_max_body_size 6m;
            proxy_pass http://qblog_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # 站内智能体：SSE 流式响应，必须关闭缓冲并以长超时连接
        location /api/ai/ {
            proxy_pass http://qblog_backend/api/ai/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
        }

        # 其他 API 保持原有限制
        location /api/ {
            proxy_pass http://qblog_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            client_max_body_size 20m;
        }

        # 带指纹的静态资源：长缓存
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Vue Router history 模式：所有前端路由回退到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
