server:
  port: 8081
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024

spring:
  application:
    name: qblog
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      # 图片仍由 UploadController 单独限制为 5 MiB。
      max-file-size: 100MB
      max-request-size: 101MB

  # MySQL 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/qblog?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 20
      idle-timeout: 60000
      pool-name: QBlogHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 60000

  # 自定义开关；连接参数使用 Spring Boot 3 的 spring.data.redis
  redis:
    enabled: ${REDIS_ENABLED:false}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${SPRING_REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${SPRING_REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${SPRING_REDIS_PASSWORD:}}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      connect-timeout: 3s
      timeout: 3s

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.qblog.entity
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    # 默认关闭 SQL stdout 日志（同步写控制台会拖慢每个请求）。
    # 本地调试需要看 SQL 时用 dev profile：--spring.profiles.active=dev
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# JWT 配置
jwt:
  secret: ${JWT_SECRET:qblog-secret-key-2024-abcdefghijklmnopqrstuvwxyz-1234567890}
  expiration: 86400000  # 24 小时

# 日志配置
logging:
  level:
    root: INFO
    com.qblog: INFO
    org.springframework.security: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n'

# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# 备份配置
backup:
  directory: ${BACKUP_DIRECTORY:backups}
  cron: ${BACKUP_CRON:0 0 2 * * ?}  # 默认每天凌晨 2 点执行

# 上传配置
upload:
  directory: ${UPLOAD_DIRECTORY:uploads}
