server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: qblog-test

  # MySQL 数据库配置（测试环境）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/qblog?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123

  # Redis 禁用配置（测试弱依赖）
  redis:
    enabled: false  # 测试 Redis 禁用场景

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.qblog.entity
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

# JWT 配置
jwt:
  secret: test-secret-key
  expiration: 86400000

# 日志配置
logging:
  level:
    root: INFO
    com.qblog: DEBUG