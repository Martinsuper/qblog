const seeds=[
{id:'n1',title:'好的产品，是让人感到平静',book:'产品思考',tag:'设计',date:'2026-05-21',star:true,body:'<p class="lead">在信息过载的日常里，我们需要的，也许不是更多功能，<br>而是一个能够安放想法的地方。</p><h2>01 / 从「更多」到「刚好」</h2><p>最近一直在想，什么样的工具才值得每天打开？不是拥有最多功能的那个，而是能够让你忘记工具本身、专注于手头事情的那个。</p><p>我们习惯用加法解决问题：增加入口、增加提醒、增加快捷操作。但好的产品往往反其道而行——<strong>把复杂留给自己，把简单留给使用者。</strong></p><blockquote>设计不是把东西放进去，而是知道什么应该留在外面。</blockquote><h2>02 / 让留白成为一种功能</h2><p>留白不只是视觉上的空隙。它是一种节奏，一种「你不必着急」的暗示。一个安静的界面，可以让思考慢一点，也深入一点。</p><ul><li><strong>减少打扰</strong>：让次要操作退后，把内容放在最前面。</li><li><strong>保持一致</strong>：稳定的布局，让每一次打开都有熟悉感。</li><li><strong>给予呼吸</strong>：行距、间距和段落，都应该服务于阅读。</li></ul><h2>03 / 一点小小的实践</h2><p>今天开始，试着不在首页展示统计数字。没有连续打卡，没有效率排名。记录本身就值得，不需要再被衡量。</p><p>希望留白成为这样一个地方：打开它，心里就安静了一点。</p>'},
{id:'n2',title:'Vue 3 组合式函数的边界',book:'技术手记',tag:'Vue',date:'2026-05-20',star:false,body:'<p class="lead">复用的不是代码片段，而是一段有边界的逻辑。</p><h2>什么时候提取 composable？</h2><p>当一段逻辑拥有独立的状态、明确的输入与输出，并且能用一个动词命名时，就可以考虑把它提取为组合式函数。</p><p>例如 <code>useNoteSearch</code> 接收笔记列表与关键词，返回过滤后的结果。不要把组件的所有操作都装进一个巨大的 <code>usePage</code>。</p><h2>让依赖可以被看见</h2><ul><li>通过参数传入依赖，而不是从全局环境悄悄读取。</li><li>副作用需要有清理机制，尤其是监听器与定时器。</li><li>优先返回 refs，保持解构后的响应性。</li></ul><blockquote>抽象的目标，是减少理解时需要记住的东西。</blockquote>'},
{id:'n3',title:'《悉达多》：倾听自己的河流',book:'阅读与生活',tag:'读书',date:'2026-05-19',star:true,body:'<p class="lead">知识可以传授，智慧却不能。</p><h2>读到河流的那一章</h2><p>悉达多在河边学会倾听。他不再试图替生活预先安排一个答案，而是允许那些快乐、困惑和遗憾同时存在。</p><blockquote>河流无处不在，同时存在于源头、河口、瀑布和海洋。</blockquote><p>我们常常太急于抵达，却忘了此刻已经是生活的一部分。这本书提醒我：经验不是为了证明某个道理，而是让人慢慢成为自己。</p><h2>写给自己的提醒</h2><ul><li>给没有结果的阅读留一点时间。</li><li>不把别人的进度当作自己的时钟。</li><li>每天留十分钟，什么也不做，只是感受。</li></ul>'},
{id:'n4',title:'笔记应用的「第二次打开」',book:'产品思考',tag:'灵感',date:'2026-05-18',star:false,body:'<p class="lead">第一次打开靠好奇，第二次打开靠信任。</p><h2>一个微小的观察</h2><p>用户写下第一条笔记后，真正的考验才开始。下次打开时，他能否立刻找到它？写到一半的内容是否还在那里？</p><p>与其增加一个令人惊喜的功能，不如先把这些不应该令人担心的事情做好。</p><h2>本周实验</h2><ul><li>默认打开最近编辑的笔记。</li><li>搜索同时覆盖标题与正文。</li><li>把保存状态放在稳定的位置，准确而克制地表达。</li></ul>'},
{id:'n5',title:'把异步状态写得更清楚',book:'技术手记',tag:'Vue',date:'2026-05-16',star:false,body:'<p class="lead">加载、成功、空数据和失败，是四种不同的界面。</p><h2>不要只有一个 loading</h2><p>请求完成并不意味着一定有数据。明确的状态模型，能够让边界情况更容易测试，也让组件模版更容易阅读。</p><p>用 <code>idle / pending / success / error</code> 表达请求生命周期，另用数据长度判断空状态。</p><h2>关于过期请求</h2><p>搜索关键词快速变化时，前一次请求可能更晚返回。使用 AbortController 取消旧请求，或用请求序号保证只有最新结果可以更新视图。</p>'},
{id:'n6',title:'周末，去公园收集一点绿色',book:'阅读与生活',tag:'灵感',date:'2026-05-15',star:false,body:'<p class="lead">一些不用整理成结论的生活碎片。</p><h2>周六下午</h2><p>树荫在石板路上缓慢移动。有人在长椅上读书，有人在湖边发呆。手机放进口袋后，才发现风的声音原来这么清楚。</p><p>买了一杯热茶，沿着不熟悉的小路走了半小时。没有走多少步的目标，也没有要拍下来的画面。</p><blockquote>偶尔，允许一天只是一段经过，而不是一份成果。</blockquote>'}
];
let notes=seeds,selected='n1',filter='all',editing=false,toastTimer,persistError=false;
function sanitize(html){const t=document.createElement('template');t.innerHTML=html;const allowed=new Set(['P','BR','H2','H3','UL','OL','LI','STRONG','EM','BLOCKQUOTE','CODE','DIV','SPAN','B','I']);function clean(root){for(const el of [...root.children]){if(!allowed.has(el.tagName)){el.replaceWith(document.createTextNode(el.textContent));continue}for(const a of [...el.attributes])el.removeAttribute(a.name);clean(el)}}clean(t.content);return t.innerHTML}
try{const saved=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(saved)&&saved.length&&saved.every(n=>n&&typeof n.id==='string'&&typeof n.title==='string'&&typeof n.body==='string'&&typeof n.book==='string'&&typeof n.tag==='string'&&typeof n.date==='string'))notes=saved.map(n=>({...n,body:sanitize(n.body),star:!!n.star}));}catch(e){persistError=true}
selected=notes[0].id;
function text(html){const t=document.createElement('div');t.innerHTML=html;return t.textContent||''}
function escape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2600)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(notes));persistError=false;return true}catch(e){persistError=true;toast('浏览器本地存储不可用，请勿关闭页面');return false}}
function current(){return notes.find(n=>n.id===selected)}
function renderList(){const query=$('search').value.trim().toLowerCase();const shown=notes.filter(n=>(filter==='all'||filter==='favorites'&&n.star||filter===n.book||filter==='#'+n.tag)&&(!query||(n.title+' '+text(n.body)+' '+n.tag).toLowerCase().includes(query)));$('listTotal').textContent=shown.length;$('allCount').textContent=String(notes.length).padStart(2,'0');$('favCount').textContent=String(notes.filter(n=>n.star).length).padStart(2,'0');document.querySelectorAll('#notebooks .nav-item').forEach(b=>b.querySelector('.count').textContent=String(notes.filter(n=>n.book===b.dataset.filter).length).padStart(2,'0'));$('noteList').innerHTML=shown.length?shown.map(n=>'<button class="note-card '+(n.id===selected?'selected':'')+'" data-id="'+escape(n.id)+'" title="打开：'+escape(n.title)+'" aria-label="打开：'+escape(n.title)+'" aria-current="'+(n.id===selected?'true':'false')+'"><span class="card-title">'+escape(n.title)+'</span>'+(n.star?'<svg class="card-star" aria-hidden="true"><use href="#i-star"/></svg>':'')+'<span class="card-excerpt">'+escape(text(n.body))+'</span><span class="card-meta">'+escape(n.date.slice(5).replace('-','月')+'日')+'<span>·</span><span class="mini-tag">'+escape(n.tag)+'</span></span></button>').join(''):'<div class="empty">没有找到笔记<br>换个关键词，或记下一个新想法。</div>';document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b.dataset.filter===filter);b.setAttribute('aria-pressed',String(b.dataset.filter===filter))})}
function updateCount(){const count=(($('noteTitle').textContent||'')+($('noteBody').textContent||'')).replace(/\s/g,'').length;$('wordCount').textContent=count+' 字 · 只属于你的思考';$('readTime').textContent='约 '+Math.max(1,Math.ceil(count/350))+' 分钟阅读'}
function renderNote(){const n=current();$('noteTitle').textContent=n.title;$('noteBody').innerHTML=n.body;$('currentNotebook').textContent=n.book;$('noteTag').textContent='# '+n.tag;$('noteDate').textContent=n.date.replaceAll('-',' / ')+' 编辑';$('favorite').classList.toggle('is-favorite',n.star);$('favorite').setAttribute('aria-pressed',String(n.star));$('favorite').title=n.star?'取消收藏':'收藏笔记';$('favorite').setAttribute('aria-label',$('favorite').title);setEditing(false);updateCount()}
function setEditing(value){editing=value;$('noteTitle').contentEditable=String(value);$('noteBody').contentEditable=String(value);$('edit').classList.toggle('editing',value);$('edit').innerHTML='<svg><use href="#i-'+(value?'check':'edit')+'"/></svg><span>'+(value?'保存':'编辑')+'</span>';$('edit').title=value?'保存到当前浏览器（本地原型）':'编辑笔记';$('edit').setAttribute('aria-label',$('edit').title);$('saveStatus').innerHTML='<svg><use href="#i-'+(value?'edit':'check')+'"/></svg>'+(value?'正在编辑 · 点击保存到本地浏览器':persistError?'本地存储不可用 · 仅当前页面保留':'本地原型 · 阅读模式')}
function save(){if(!editing)return;const n=current();n.title=$('noteTitle').textContent.trim()||'未命名笔记';n.body=sanitize($('noteBody').innerHTML);n.date=new Date().toLocaleDateString('sv-SE');const ok=persist();renderNote();renderList();if(ok){$('saveStatus').innerHTML='<svg><use href="#i-check"/></svg>已保存到此浏览器 · 本地原型';toast('已保存到本地浏览器，不会上传服务器')}}
$('edit').onclick=()=>{if(editing)save();else{setEditing(true);$('noteBody').focus()}};
$('noteTitle').addEventListener('input',updateCount);$('noteBody').addEventListener('input',updateCount);
$('noteTitle').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('noteBody').focus()}});
for(const id of ['noteTitle','noteBody'])$(id).addEventListener('paste',e=>{if(!editing)return;e.preventDefault();const value=e.clipboardData.getData('text/plain');const selection=window.getSelection();if(!selection.rangeCount)return;const range=selection.getRangeAt(0);range.deleteContents();const node=document.createTextNode(value);range.insertNode(node);range.setStartAfter(node);range.collapse(true);selection.removeAllRanges();selection.addRange(range);updateCount()});
$('noteList').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;if(editing)save();selected=b.dataset.id;renderList();renderNote();$('app').classList.remove('show-list');document.querySelector('.reading-scroll').scrollTop=0};
$('search').oninput=renderList;
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{if(editing)save();filter=b.dataset.filter;$('listName').textContent=filter==='all'?'全部笔记':filter==='favorites'?'我的收藏':filter.startsWith('#')?'标签 · '+filter.slice(1):filter;renderList();$('app').classList.remove('nav-open');$('app').classList.add('show-list')});
$('favorite').onclick=()=>{if(editing)save();const n=current();n.star=!n.star;const ok=persist();renderNote();renderList();toast((n.star?'已加入收藏':'已取消收藏')+(ok?' · 已保存在本地':' · 仅当前页面保留'))};
$('newNote').onclick=()=>{if(editing)save();const book=['产品思考','技术手记','阅读与生活'].includes(filter)?filter:'产品思考';const n={id:'note-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),title:'未命名笔记',book,tag:book==='技术手记'?'Vue':book==='阅读与生活'?'读书':'灵感',date:new Date().toLocaleDateString('sv-SE'),star:false,body:'<p>从一个小小的想法开始……</p>'};notes.unshift(n);selected=n.id;filter='all';$('listName').textContent='全部笔记';$('search').value='';persist();renderList();renderNote();$('app').classList.remove('show-list');setEditing(true);$('noteTitle').focus();const range=document.createRange();range.selectNodeContents($('noteTitle'));const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range)};
$('focus').onclick=()=>{const on=$('app').classList.toggle('focus');$('focus').setAttribute('aria-pressed',String(on));$('focus').title=on?'退出专注模式（Esc）':'进入专注模式';$('focus').setAttribute('aria-label',$('focus').title);toast(on?'已进入专注模式 · 按 Esc 退出':'已退出专注模式')};
$('backList').onclick=()=>{if(editing)save();$('app').classList.remove('focus');$('focus').setAttribute('aria-pressed','false');$('focus').title='进入专注模式';$('focus').setAttribute('aria-label','进入专注模式');$('app').classList.add('show-list')};$('menuButton').onclick=()=>$('app').classList.add('nav-open');$('shade').onclick=()=>$('app').classList.remove('nav-open');
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(editing)save();else toast('当前内容已在本地原型中')}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('app').classList.remove('focus');$('focus').setAttribute('aria-pressed','false');$('focus').title='进入专注模式';$('focus').setAttribute('aria-label','进入专注模式');$('app').classList.add('show-list');$('search').focus()}if(e.key==='Escape'){$('app').classList.remove('focus','nav-open');$('focus').setAttribute('aria-pressed','false');$('focus').title='进入专注模式';$('focus').setAttribute('aria-label','进入专注模式')}});
window.addEventListener('beforeunload',e=>{if(editing){e.preventDefault();e.returnValue=''}});renderList();renderNote();
</script>
</body>
