<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>纸间手记 · YOUNOTE 方案 C</title><style>
:root{--paper:#f8f5ee;--ink:#343e35;--muted:#858a7c;--line:#e2e2d5;--green:#44644c;--orange:#be6946}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit;color:inherit}button,a{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--orange);outline-offset:4px}button{border:0;background:none}a{color:inherit;text-decoration:none}aside{width:232px;position:fixed;inset:0 auto 0 0;padding:34px 24px;background:#eeeee3;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;font-size:19px;letter-spacing:2px;font-weight:650}.mark{width:34px;height:37px;border:1.5px solid var(--green);border-radius:4px 12px 4px 4px;display:grid;place-items:center;font:23px Georgia;color:var(--green)}.brand small{display:block;font:9px/1.7 sans-serif;letter-spacing:3px;color:var(--muted)}.new{background:var(--green);color:white;border-radius:7px;padding:11px;margin:35px 0 24px;text-align:left}.nav{display:flex;flex-direction:column;gap:5px}.nav button{display:flex;align-items:center;gap:13px;text-align:left;padding:9px 13px;border-radius:6px;color:#6e7569}.nav button.active{background:#e0e5d7;color:#35523c;font-weight:600}.count{margin-left:auto;font-size:11px;opacity:.65}.side-label{font-size:10px;letter-spacing:2px;color:var(--muted);margin:29px 12px 12px}.dot{width:7px;height:7px;background:#b1ba9c;border-radius:50%;display:inline-block;margin-right:9px}.tagbtn{padding:7px 12px;display:block;width:100%;text-align:left;color:#697163}.side-bottom{margin-top:auto;padding-top:30px;font-size:11px;color:#7d8577}.profile{display:flex;gap:10px;align-items:center;border-top:1px solid #d8dccd;margin-top:18px;padding-top:19px}.avatar{background:#dce3d1;border-radius:50%;width:31px;height:31px;display:grid;place-items:center}.profile strong{font-size:12px;font-weight:500}.profile span{font-size:10px}.main{margin-left:232px;padding:0 50px 50px;max-width:1650px}.topbar{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}.topbar a{border:1px solid var(--line);padding:5px 12px;border-radius:20px}.heading{display:flex;align-items:flex-end;justify-content:space-between;padding:37px 0 28px}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--orange)}h1{font-family:"Songti SC","Noto Serif SC",SimSun,serif;font-size:34px;font-weight:500;letter-spacing:2px;margin:8px 0 7px}.sub{font-size:12px;color:var(--muted)}.date{text-align:right;color:#8c907f;font-size:11px}.date b{font:36px Georgia;color:var(--green)}.quick{background:#fffdf7;border:1px solid #dedfcf;border-radius:10px;padding:19px 23px;box-shadow:0 5px 16px #454c3510}.quick textarea{width:100%;resize:vertical;background:transparent;border:none;outline:none;min-height:56px;font-size:14px}.quick-foot{display:flex;align-items:center;justify-content:space-between;color:#8c907f;font-size:11px}.quick-foot button{padding:7px 17px;background:var(--green);color:white;border-radius:5px}.toolbar{display:flex;align-items:center;gap:7px;margin:30px 0 20px}.filter{padding:6px 15px;border-radius:20px;color:#858b7d;font-size:12px}.filter.active{background:#e5e9dd;color:#3e5b44}.search{margin-left:auto;display:flex;align-items:center;gap:8px;border-bottom:1px solid #d5d9ca;padding:5px 0;color:#919785}.search input{width:150px;border:0;outline:none;background:none;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:21px;align-items:start}.note{background:#fffdf7;border:1px solid #e3e2d6;border-radius:8px;overflow:hidden;transition:transform .2s,box-shadow .2s}.note:hover{transform:translateY(-3px);box-shadow:0 9px 20px #474f3610}.note-content{padding:22px 23px 15px;cursor:pointer;outline-offset:-4px;min-height:200px}.note:nth-child(3n+2){background:#edf0e5}.note:nth-child(3n){background:#f5eddf}.note-type{color:#929783;font-size:10px;display:flex;justify-content:space-between;letter-spacing:1px}.note h2{font:500 20px/1.5 "Songti SC",SimSun,serif;margin:16px 0 12px}.note p{font-size:12px;color:#777e6d;line-height:1.95;margin:0;white-space:pre-wrap}.note-footer{display:flex;justify-content:space-between;border-top:1px solid #e1e3d6;padding:10px 22px;color:#929783;font-size:10px}.pin{color:#9f683f;font-size:14px;padding:0 2px}.note .quote{font:46px/1 Georgia;color:#a7b39b;margin-top:10px}.empty{text-align:center;padding:60px;color:var(--muted);grid-column:1/-1}.page-foot{padding-top:35px;text-align:center;color:#9b9e8c;font-size:10px;letter-spacing:2px}dialog{border:1px solid #dedfcf;border-radius:12px;background:var(--paper);color:var(--ink);padding:28px;width:min(660px,90vw);max-height:88vh}dialog::backdrop{background:#252e2559;backdrop-filter:blur(4px)}.modal-head{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.modal-title{display:block;width:100%;margin:25px 0 16px;background:none;border:0;border-bottom:1px solid var(--line);padding-bottom:12px;font:26px "Songti SC",SimSun,serif;outline:none}.modal-body{width:100%;height:280px;background:none;border:0;resize:vertical;outline:none;line-height:2}.modal-foot{display:flex;align-items:center;justify-content:space-between;margin-top:20px;font-size:11px;color:var(--muted)}.save{background:var(--green);color:white;border-radius:5px;padding:8px 17px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#344e3c;color:white;border-radius:7px;padding:10px 22px;font-size:12px;z-index:9}.toast:empty{display:none}@media(min-width:1450px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:1100px){.main{padding-left:30px;padding-right:30px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}aside{width:205px;padding:30px 18px}.main{margin-left:205px}}@media(max-width:720px){aside{position:static;width:auto;padding:17px 20px;display:block;border-right:0}.brand small,.side-label,.tagbtn,.side-bottom,.new{display:none}.brand{font-size:16px}.mark{width:27px;height:29px;font-size:19px}.nav{flex-direction:row;margin-top:13px;overflow:auto}.nav button{white-space:nowrap;font-size:12px;padding:6px 10px}.count{display:none}.main{margin:0;padding:0 20px 30px}.topbar{height:52px}.heading{padding:26px 0 20px}h1{font-size:29px}.date{display:none}.grid{gap:15px}.note-content{padding:17px;min-height:180px}.note h2{font-size:18px}.toolbar{flex-wrap:wrap}.search{width:100%;margin-top:10px}.search input{width:100%}}@media(max-width:430px){.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><aside><a class="brand" href="index.html"><span class="mark">y</span><div>纸间手记<small>YOUNOTE / PERSONAL SPACE</small></div></a><button class="new" id="new">＋　写一则新笔记</button><nav class="nav"><button class="active" data-nav="all">▦　全部笔记 <span class="count" id="total">06</span></button><button data-nav="recent">◷　最近记录</button><button data-nav="star">☆　我的收藏</button></nav><div class="side-label">我的笔记本 / NOTEBOOKS</div><button class="tagbtn" data-category="生活手记"><i class="dot"></i>生活手记</button><button class="tagbtn" data-category="阅读摘录"><i class="dot" style="background:#cbab80"></i>阅读摘录</button><button class="tagbtn" data-category="灵感碎片"><i class="dot" style="background:#adada1"></i>灵感碎片</button><button class="tagbtn" data-category="学习笔记"><i class="dot" style="background:#9cacb4"></i>学习笔记</button><div class="side-bottom">给想法一个安静的地方。<div class="profile"><div class="avatar">Y</div><div><strong>我的私人空间</strong><br><span>方案 C · 本地交互原型</span></div></div></div></aside><main class="main"><header class="topbar"><span>我的空间　/　<span id="crumb">全部笔记</span></span><a href="index.html">← 查看全部设计方案</a></header><section class="heading"><div><div class="eyebrow">A LITTLE SPACE FOR YOUR MIND</div><h1 id="view-title">让想法，慢慢生长。</h1><div class="sub">不必完整，也不必完美。记下此刻想到的。</div></div><div class="date">OCTOBER, 2026<br><b>29</b>　星期四</div></section><section class="quick"><textarea id="quick-text" aria-label="快速记录" placeholder="此刻，有什么值得记下？"></textarea><div class="quick-foot"><span>✎　灵感碎片 · 仅保存在当前浏览器</span><button id="quick-save">记下来 ↗</button></div></section><section class="toolbar"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="生活手记">生活</button><button class="filter" data-filter="阅读摘录">阅读</button><button class="filter" data-filter="灵感碎片">灵感</button><button class="filter" data-filter="学习笔记">学习</button><label class="search">⌕ <input id="search" placeholder="寻找一段记忆…" aria-label="搜索笔记"></label></section><section class="grid" id="grid"></section><footer class="page-foot">记录，是与自己的温柔对话。 / YOUNOTE</footer></main><dialog id="editor"><div class="modal-head"><span id="editor-category">生活手记</span><button id="close" aria-label="关闭笔记">✕</button></div><input id="title" class="modal-title" aria-label="笔记标题" placeholder="给这段想法取个名字"><textarea id="body" class="modal-body" aria-label="笔记正文" placeholder="从这里开始记录…"></textarea><div class="modal-foot"><span>演示数据 · 仅保存在当前浏览器</span><button class="save" id="save">保存笔记</button></div></dialog><div class="toast" role="status" id="toast"></div><script>
const initial=[{id:1,title:'把日子过成喜欢的样子',category:'生活手记',body:'今天提早一站下车，沿着河边走回家。\n\n秋天的风已经有了凉意，树叶在脚边发出细碎的声响。忽然觉得，生活里的小确幸，大多发生在不赶时间的时候。\n\n慢一点，也没关系。',date:'10 月 29 日',star:true},{id:2,title:'关于「专注」的几个想法',category:'学习笔记',body:'真正的专注，不是努力对抗分心，而是给自己创造一个不容易分心的环境。\n\n01 关掉不必要的通知\n02 一次只做一件事\n03 给大脑留一点空白\n\n试着从每天的 25 分钟开始。',date:'10 月 28 日',star:false},{id:3,title:'万物皆有裂痕',category:'阅读摘录',body:'「万物皆有裂痕，那是光照进来的地方。」\n\n— Leonard Cohen\n\n不必等到准备好，才开始做喜欢的事。有些答案，只能在行走中找到。',date:'10 月 27 日',star:true},{id:4,title:'一个关于笔记的灵感',category:'灵感碎片',body:'笔记不应该只是信息的仓库，更应该是思想的花园。\n\n让旧的想法和新的发现相遇，不急着分类，不急着得出结论。\n\n也许最好的工具，是那个让你忘记工具本身的工具。',date:'10 月 26 日',star:false},{id:5,title:'周末的小小计划',category:'生活手记',body:'☐ 去逛一家没去过的书店\n☐ 整理阳台上的植物\n☐ 给自己做一顿认真的早餐\n☑ 读完床头的那本书\n\n留一半时间，给计划之外的美好。',date:'10 月 25 日',star:false},{id:6,title:'阅读，是一场缓慢的旅行',category:'阅读摘录',body:'读书不是为了记住每一句话，而是为了在某一个瞬间，遇见一个更辽阔的自己。\n\n本月书单：\n《也许你该找个人聊聊》\n《置身事内》\n《当呼吸化为空气》',date:'10 月 23 日',star:false}];
let notes=initial;try{const saved=JSON.parse(localStorage.getItem('younote-paper-v1'));if(Array.isArray(saved)&&saved.every(n=>n&&typeof n.title==='string'&&typeof n.body==='string'))notes=saved}catch{}let filter='all',nav='all',editing=null;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let timer;function toast(text){$('#toast').textContent=text;clearTimeout(timer);timer=setTimeout(()=>$('#toast').textContent='',2600)}function persist(){try{localStorage.setItem('younote-paper-v1',JSON.stringify(notes));toast('已保存在当前浏览器')}catch{toast('浏览器存储不可用，本次修改仅在当前页面保留')}}
function render(){const q=$('#search').value.toLowerCase();let list=notes.filter(n=>(filter==='all'||n.category===filter)&&(nav!=='star'||n.star)&&(n.title+' '+n.body).toLowerCase().includes(q));if(nav==='recent')list=list.slice(0,4);$('#total').textContent=String(notes.length).padStart(2,'0');$('#grid').innerHTML=list.length?list.map(n=>`<article class="note"><div class="note-content" role="button" tabindex="0" data-open="${n.id}" aria-label="打开 ${esc(n.title)}"><div class="note-type"><span>${esc(n.category)}</span><span>↗</span></div>${n.category==='阅读摘录'?'<div class="quote">“</div>':''}<h2>${esc(n.title)}</h2><p>${esc(n.body.slice(0,155))}${n.body.length>155?'…':''}</p></div><div class="note-footer"><span>${esc(n.date)}</span><button class="pin" data-star="${n.id}" aria-label="${n.star?'取消收藏':'收藏'} ${esc(n.title)}" title="${n.star?'取消收藏':'收藏'}">${n.star?'★':'☆'}</button></div></article>`).join(''):'<div class="empty">这里还没有笔记。写下你的第一个想法吧。</div>'}
function openNote(id){editing=id;const n=notes.find(n=>n.id===id);$('#title').value=n?n.title:'';$('#body').value=n?n.body:'';$('#editor-category').textContent=n?n.category:'灵感碎片';$('#editor').showModal();if(!n)$('#title').focus()}
$('#grid').addEventListener('click',e=>{const star=e.target.closest('[data-star]'),card=e.target.closest('[data-open]');if(star){const n=notes.find(n=>String(n.id)===star.dataset.star);n.star=!n.star;persist();render()}else if(card)openNote(Number(card.dataset.open))});$('#grid').addEventListener('keydown',e=>{const c=e.target.closest('[data-open]');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openNote(Number(c.dataset.open))}});$('#new').onclick=()=>openNote(null);$('#close').onclick=()=>$('#editor').close();$('#save').onclick=()=>{const title=$('#title').value.trim(),body=$('#body').value.trim();if(!title){toast('请先填写笔记标题');$('#title').focus();return}if(editing!==null){const n=notes.find(n=>n.id===editing);n.title=title;n.body=body}else notes.unshift({id:Date.now(),title,body,category:'灵感碎片',date:'刚刚',star:false});persist();$('#editor').close();render()};$('#quick-save').onclick=()=>{const body=$('#quick-text').value.trim();if(!body){$('#quick-text').focus();toast('先写下一点想法吧');return}notes.unshift({id:Date.now(),title:body.split('\n')[0].slice(0,24),body,category:'灵感碎片',date:'刚刚',star:false});$('#quick-text').value='';filter='all';nav='all';$('#search').value='';sync();persist()};function sync(){document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',filter==='all'&&b.dataset.nav===nav));const name=filter!=='all'?filter:nav==='star'?'我的收藏':nav==='recent'?'最近记录':'全部笔记';$('#crumb').textContent=name;$('#view-title').textContent=name==='全部笔记'?'让想法，慢慢生长。':name;render()}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;sync()});document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{nav=b.dataset.nav;filter='all';sync()});document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{filter=b.dataset.category;nav='all';sync()});$('#search').oninput=render;render();
</script></body></html>
