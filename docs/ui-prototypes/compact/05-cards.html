 aria-hidden="true"><path d="M3 6h6l2 2h10v11H3V6Z"/></svg> <span>阅读摘录</span> <span class="count">1</span></div><div class="side-section caps">标签</div><div class="side-item"># &nbsp;方法论　<span class="count">1</span></div><div class="side-item"># &nbsp;知识管理　<span class="count">1</span></div><div class="side-item"># &nbsp;复盘　<span class="count">1</span></div><div class="sidebar-bottom"><div>↥ &nbsp;备份与恢复</div><div class="notice"><span class="dot"></span>AI 与索引未配置</div></div></aside><div class="splitter splitter-one" role="separator" aria-label="调整目录宽度" aria-orientation="vertical" aria-controls="pane-sidebar" tabindex="0"></div><section class="list" id="pane-list"><div class="list-header"><div class="eyebrow">YOUR KNOWLEDGE BASE</div><div class="list-title"><h2>全部笔记 <span class="muted tiny">5</span></h2><button class="add" title="新建笔记（展示）"><svg class="kb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div><div class="search-wrap"><svg class="kb-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input class="search" placeholder="搜索笔记、标签..." aria-label="搜索笔记"></div></div><div class="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="favorite"><svg class="kb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg> 收藏</button><span style="margin-left:auto">最近更新 ↓</span></div><div class="note-list"></div></section><div class="splitter splitter-two" role="separator" aria-label="调整笔记列表宽度" aria-orientation="vertical" aria-controls="pane-list" tabindex="0"></div><main class="editor" id="pane-editor"><div class="editor-bar"><span class="muted tiny">知识库 <span style="padding:0 6px">/</span> <span class="current-folder">知识管理</span></span><div class="actions"><span class="save">仅本页演示</span><button class="icon-btn star starred" aria-label="切换收藏" aria-pressed="true"><svg class="kb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg></button><button class="icon-btn" title="更多（展示）">···</button></div></div><div class="editor-scroll"><article class="page"><div class="breadcrumb">我的知识库　/　<span class="current-folder">知识管理</span>　/　笔记</div><h1 class="current-title"></h1><div class="metadata"><span>◷ 更新于 <span class="current-date"></span></span><span>·</span><span>示例笔记</span><span class="current-tags"></span></div><div class="rule"></div><div class="content" contenteditable="true" aria-label="笔记正文"></div></article></div><div class="toolbar" aria-label="格式工具栏（展示）"><svg class="kb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14"/><path d="M7 5h5.2a3.9 3.9 0 0 1 0 7.8H7"/><path d="M7 12.8h6a3.6 3.6 0 0 1 0 7.2H7"/></svg><svg class="kb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14"/><path d="M13 5v14"/><path d="M6 12h7"/></svg><svg class="kb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg><svg class="kb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8.5 7.5-5 4.5 5 4.5"/><path d="m15.5 7.5 5 4.5-5 4.5"/></svg></div><div class="doc-end"><span>YOUNOTE · 让知识有序可寻</span><span role="status" aria-live="polite">正文可直接编辑 · 仅保留在本页</span></div></main></div><script>const notes=[{title:'打造属于自己的知识系统',folder:'知识管理',date:'10月29日',tags:['方法论','知识管理'],excerpt:'从收集到连接，让知识真正成为自己的思考工具。',body:`<p class="lead">从收集到连接，让知识真正成为自己的思考工具。</p><h2>为什么需要一个知识系统？</h2><p>我们每天接触大量的信息，收藏很容易，但真正困难的是在需要的时候找到它、理解它，并把它应用到新的问题中。</p><blockquote>知识的价值，不在于拥有多少，而在于能否在恰当的时候调用。</blockquote><h2>我的实践原则</h2><ul><li><strong>先记录，再整理。</strong>降低捕捉想法的门槛，不让结构妨碍思考。</li><li><strong>建立连接。</strong>用自己的语言描述概念，让笔记之间产生关联。</li><li><strong>定期回顾。</strong>让沉淀的内容重新进入工作和生活。</li></ul><h2>下一步</h2><p>从一个真实的问题出发，持续积累，而不是追求一开始就建立完美的体系。</p>`},{title:'如何做好每周回顾',folder:'个人成长',date:'10月27日',tags:['复盘','习惯'],excerpt:'用三个问题，为下一周留出更清晰的空间。',body:`<p class="lead">用三个问题，为下一周留出更清晰的空间。</p><h2>回顾过去的一周</h2><p>整理完成的事情，记录值得庆祝的进展，也诚实面对没有达到预期的部分。</p><h2>三个问题</h2><ul><li>这周什么事情做得好？</li><li>什么事情消耗了不必要的精力？</li><li>下一周最重要的一件事是什么？</li></ul><blockquote>回顾不是为了评判自己，而是为了更好地前进。</blockquote>`},{title:'产品思考：从问题出发',folder:'工作笔记',date:'10月24日',tags:['产品','思考'],excerpt:'好的解决方案，始于对问题的准确描述。',body:`<p class="lead">好的解决方案，始于对问题的准确描述。</p><h2>先理解问题</h2><p>不要急于讨论功能，先观察用户的真实处境：他们想完成什么，在哪里遇到了阻碍？</p><h2>记录假设</h2><ul><li>明确目标用户和使用场景。</li><li>区分事实、推测和待验证的问题。</li><li>用最小的实验验证最重要的假设。</li></ul>`},{title:'阅读清单 · 2024',folder:'阅读摘录',date:'10月20日',tags:['阅读','清单'],excerpt:'那些值得慢慢读、反复思考的书。',body:`<p class="lead">那些值得慢慢读、反复思考的书。</p><h2>正在阅读</h2><ul><li>《思考，快与慢》</li><li>《置身事内》</li><li>《设计心理学》</li></ul><p>读完后写下自己的理解，比单纯摘录更重要。</p>`},{title:'一些关于专注的想法',folder:'个人成长',date:'10月18日',tags:['专注','随想'],excerpt:'给重要的事情留出不被打断的时间。',body:`<p class="lead">给重要的事情留出不被打断的时间。</p><h2>为专注创造条件</h2><p>关闭不必要的通知，把注意力放回眼前的工作。一次只做一件事，让思考有时间慢慢展开。</p><blockquote>专注是一种可以练习的能力。</blockquote>`}];let current=0,filter='all',favorites=new Set([0,1]), drafts={};const $=s=>document.querySelector(s);function renderList(){let q=$('.search').value.trim().toLowerCase();let list=notes.map((n,i)=>({n,i})).filter(({n,i})=>(filter==='all'||favorites.has(i))&&[n.title,n.folder,n.excerpt,...n.tags].join(' ').toLowerCase().includes(q));$('.note-list').innerHTML=list.length?list.map(({n,i})=>`<button class="note ${i===current?'active':''}" data-i="${i}"><div class="note-title"><span class="note-name"><svg class="kb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h6l2 2h10v11H3V6Z"/></svg><span>${n.title}</span></span><span class="note-favorite">${favorites.has(i)?'<svg class="kb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>':''}</span></div><div class="note-excerpt">${n.excerpt}</div><div class="note-meta"><span>${n.folder} · ${n.date}</span><span># ${n.tags[0]}</span></div></button>`).join(''):'<div class="empty">没有找到匹配的笔记</div>';document.querySelectorAll('.note').forEach(b=>b.onclick=()=>show(+b.dataset.i))}function show(i){current=i;let n=notes[i];document.querySelectorAll('.current-folder').forEach(e=>e.textContent=n.folder);$('.current-title').textContent=n.title;$('.current-date').textContent=n.date;$('.current-tags').innerHTML=n.tags.map(t=>`<span class="tag"># ${t}</span>`).join(' ');$('.content').innerHTML=drafts[i]??n.body;$('.star').setAttribute('aria-pressed', String(favorites.has(i)));$('.star').classList.toggle('starred',favorites.has(i));let outline=document.querySelector('.outline');if(outline)outline.innerHTML=Array.from($('.content').querySelectorAll('h2')).map(h=>h.textContent).join('<br>');renderList()}$('.search').addEventListener('input',renderList);document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));renderList()});$('.star').onclick=()=>{favorites.has(current)?favorites.delete(current):favorites.add(current);show(current)};$('.content').addEventListener('input',()=>{drafts[current]=$('.content').innerHTML;$('.save').textContent='本页草稿';});show(0);
// 分栏状态只存在于当前页面；移动端继续使用原有纵向布局。
(function(){
 const app=document.querySelector('.app');
 const mobile=window.matchMedia('(max-width:700px)');
 const panes=[
  {el:document.querySelector('.sidebar'),name:'目录',width:190,min:150,max:360,open:true},
  {el:document.querySelector('.list'),name:'笔记列表',width:330,min:200,max:560,open:true},
  {el:document.querySelector('.editor'),min:240,open:true}
 ];
 const handles=[...document.querySelectorAll('.splitter')];
 panes.slice(0,2).forEach((pane,i)=>{
  const button=document.createElement('button');
  button.type='button';button.className=`pane-toggle pane-toggle-${i===0?'one':'two'}`;button.setAttribute('aria-controls',pane.el.id);
  app.appendChild(button);pane.button=button;
  button.addEventListener('click',()=>{pane.open=!pane.open;update();});
 });
 // 预算同时为其他展开栏保留最小宽度；缩窗只压缩显示宽度，不丢失用户设定。
 function layout(){
  const available=app.clientWidth;
  const activeHandles=[panes[0].open&&panes[1].open,panes[1].open&&panes[2].open];
  const room=Math.max(0,available-activeHandles.filter(Boolean).length*4);
  const widths=[0,0];
  for(let i=0;i<2;i++){
   if(!panes[i].open)continue;
   const reserved=panes.slice(i+1).reduce((sum,p)=>sum+(p.open?p.min:0),0);
   const remaining=Math.max(0,room-widths[0]-widths[1]-reserved);
   widths[i]=Math.max(0,Math.min(panes[i].width,panes[i].max,remaining));
  }
  const editor=panes[2].open?Math.max(0,room-widths[0]-widths[1]):0;
  return {widths,editor,activeHandles,room};
 }
 function update(){
  const desktop=!mobile.matches;
  const state=layout();
  app.style.setProperty('--columns',`${state.widths[0]}px ${state.activeHandles[0]?4:0}px ${state.widths[1]}px ${state.activeHandles[1]?4:0}px minmax(0,1fr)`);
  panes.forEach(p=>{
   p.el.classList.toggle('pane-collapsed',desktop&&!p.open);
   if(desktop&&!p.open)p.el.setAttribute('aria-hidden','true');else p.el.removeAttribute('aria-hidden');
   if(!p.button)return;
   p.button.setAttribute('aria-expanded',String(p.open));
   p.button.setAttribute('aria-label',`${p.open?'收起':'恢复'}${p.name}`);
   p.button.title=`${p.open?'收起':'恢复'}${p.name}`;
   p.button.innerHTML=`<svg class="kb-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${p.open?'m14 6-6 6 6 6':'m10 6 6 6-6 6'}"/></svg>`;
  });
  handles.forEach((h,i)=>{
   h.hidden=!desktop||!state.activeHandles[i];
   const max=Math.max(panes[i].min,Math.min(panes[i].max,state.room-(i===1?state.widths[0]:0)-panes.slice(i+1).reduce((sum,p)=>sum+(p.open?p.min:0),0)));
   h.setAttribute('aria-valuemin',String(panes[i].min));h.setAttribute('aria-valuemax',String(Math.round(max)));
   h.setAttribute('aria-valuenow',String(Math.round(state.widths[i])));
   h.setAttribute('aria-valuetext',`${Math.round(state.widths[i])} 像素`);
  });
 }
 function resize(i,value){
  const state=layout();
  const reserved=panes.slice(i+1).reduce((sum,p)=>sum+(p.open?p.min:0),0);
  const max=Math.max(panes[i].min,Math.min(panes[i].max,state.room-(i===1?state.widths[0]:0)-reserved));
  panes[i].width=Math.max(panes[i].min,Math.min(max,value));update();
 }
 handles.forEach((h,i)=>{
  let drag=null;
  h.addEventListener('pointerdown',e=>{
   if(e.button!==0)return;
   drag={id:e.pointerId,x:e.clientX,width:layout().widths[i]};h.setPointerCapture(e.pointerId);h.classList.add('dragging');e.preventDefault();
  });
  h.addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.id)resize(i,drag.width+e.clientX-drag.x)});
  function end(e){if(drag&&e.pointerId===drag.id){drag=null;h.classList.remove('dragging')}}
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);h.addEventListener('lostpointercapture',end);
  h.addEventListener('keydown',e=>{
   const current=layout().widths[i],step=e.shiftKey?40:10;
   if(e.key==='ArrowLeft')resize(i,current-step);
   else if(e.key==='ArrowRight')resize(i,current+step);
   else if(e.key==='Home')resize(i,panes[i].min);
   else if(e.key==='End')resize(i,Infinity);
   else return;
   e.preventDefault();
  });
 });
 window.addEventListener('resize',update);mobile.addEventListener('change',update);update();
})();
</script></body></html>
