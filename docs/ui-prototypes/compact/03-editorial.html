<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>03 / Editorial · YOUNOTE 原型</title><style>:root{--bg:#eee9df;--ink:#37332e;--body:#59534b;--muted:#a9a093;--soft:#786f64;--accent:#b27357;--selected:#f4e9e1;--line:#e9e1d7;--side:#f8f4ed;--panel:#f9f6ef;--paper:#fffdf8;--rail:#efe8dc;}.app{grid-template-columns:220px 280px minmax(0,1fr);grid-template-rows:60px minmax(0,1fr);--medium-cols:185px 250px minmax(0,1fr)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;color:var(--ink);background:var(--bg)}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.app{height:100vh;min-height:620px;display:grid;overflow:hidden}.rail,.sidebar,.list,.editor,.insight,.top{min-width:0}.brand{display:flex;align-items:center;gap:9px;font-weight:750;letter-spacing:.09em}.logo{width:27px;height:27px;border-radius:8px;background:var(--accent);color:white;display:grid;place-items:center;font-size:15px}.muted{color:var(--muted)}.tiny{font-size:11px}.caps{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--muted)}.sidebar{padding:22px 15px;background:var(--side);border-right:1px solid var(--line);overflow:auto}.sidebar .brand{margin:0 5px 28px}.side-section{margin:23px 0 9px;padding:0 9px}.side-item{display:flex;align-items:center;gap:9px;padding:9px;border-radius:7px;color:var(--soft);margin:2px 0}.side-item.active{color:var(--accent);background:var(--selected);font-weight:700}.side-item .count{margin-left:auto;font-size:11px;color:var(--muted)}.sidebar-bottom{margin-top:34px;padding:12px 9px;border-top:1px solid var(--line);line-height:2}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#d0a458;margin-right:5px}.list{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}.list-header{padding:25px 18px 13px}.eyebrow{font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:700}.list-title{display:flex;justify-content:space-between;align-items:center;margin:8px 0 15px}.list-title h2{font-size:18px;margin:0}.add{border:0;background:var(--accent);color:white;width:28px;height:28px;border-radius:7px;font-size:19px}.search{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:9px 10px;color:var(--ink);outline:none}.filters{display:flex;gap:7px;padding:0 18px 12px;align-items:center;color:var(--muted);font-size:11px}.filter{border:0;background:none;padding:5px 7px;border-radius:5px;color:var(--muted)}.filter.active{background:var(--selected);color:var(--accent);font-weight:700}.note-list{overflow:auto;padding:0 8px 20px}.note{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 11px;border-radius:6px}.note.active{background:var(--selected);border-bottom-color:transparent}.note-title{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:5px}.note-excerpt{font-size:11px;color:var(--muted);margin:8px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.note-meta{font-size:10px;color:var(--muted);display:flex;justify-content:space-between}.editor{background:var(--paper);overflow:auto}.editor-bar{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);gap:10px}.actions{display:flex;align-items:center;gap:12px;color:var(--muted)}.icon-btn{background:none;border:0;padding:5px;font-size:16px}.icon-btn.starred{color:#d7a148}.save{font-size:11px;white-space:nowrap}.save:before{content:'●';color:#75a789;margin-right:6px;font-size:8px}.page{max-width:760px;margin:0 auto;padding:45px 54px 80px}.breadcrumb{font-size:11px;color:var(--muted);margin-bottom:24px}.page h1{font-size:29px;letter-spacing:-.04em;margin:0 0 13px;line-height:1.3}.metadata{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:11px}.tag{background:var(--selected);color:var(--accent);padding:4px 8px;border-radius:4px}.rule{height:1px;background:var(--line);margin:26px 0}.content{color:var(--body);font-size:13px;line-height:1.95;outline:none}.content h2{font-size:16px;margin:28px 0 8px;color:var(--ink)}.content p{margin:10px 0}.content .lead{font-size:15px;color:var(--soft)}.content ul{padding-left:20px}.content li{padding:3px 0}.content blockquote{margin:20px 0;padding:10px 16px;border-left:3px solid var(--accent);background:var(--selected);color:var(--soft)}.toolbar{display:flex;gap:14px;color:var(--muted);font-size:12px;margin-bottom:22px}.insight{padding:26px 18px;background:var(--panel);border-left:1px solid var(--line);overflow:auto}.insight h3{font-size:12px;margin:0 0 16px}.insight-block{padding:18px 0;border-bottom:1px solid var(--line)}.insight-block p{line-height:1.8;color:var(--muted);font-size:11px}.outline{line-height:2.4;color:var(--soft);font-size:11px}.notice{font-size:10px;color:var(--muted);line-height:1.7}.top{display:flex;align-items:center;padding:0 23px;border-bottom:1px solid var(--line);background:var(--panel);gap:22px}.top .spacer{flex:1}.top-link{color:var(--muted);font-size:12px}.demo{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:4px 7px;white-space:nowrap}.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:17px 0;gap:23px;border-right:1px solid var(--line)}.rail .rail-icon{font-size:17px;color:var(--muted)}.rail .rail-icon.active{color:var(--accent)}.rail .bottom{margin-top:auto}.empty{padding:25px 12px;color:var(--muted);font-size:12px}.mobile-nav{display:none}@media(max-width:1050px){.insight{display:none!important}.app{grid-template-columns:var(--medium-cols)!important}.page{padding-left:38px;padding-right:38px}}@media(max-width:700px){.app{height:auto;min-height:100vh;display:flex!important;flex-direction:column;overflow:visible}.rail,.sidebar,.insight{display:none!important}.top{height:52px;flex-shrink:0}.top-link{display:none}.list{height:auto;border-right:0;border-bottom:1px solid var(--line)}.list-header{padding:17px 18px 10px}.list-title{margin:5px 0 10px}.filters{padding-bottom:7px}.note-list{display:flex;overflow-x:auto;padding:0 10px 10px;gap:6px}.note{flex:0 0 210px;border:1px solid var(--line);padding:10px}.note-excerpt{margin:5px 0}.editor{overflow:visible}.editor-bar{padding:0 18px;height:50px}.page{padding:30px 22px 60px}.page h1{font-size:25px}.mobile-nav{display:block}}.top{grid-column:1/-1}.sidebar .brand{display:none}.page{max-width:780px;padding-top:56px}.page h1,.content h2{font-family:Georgia,"Songti SC",serif}.page h1{font-size:33px}.editor{background:#f1ede5;padding:18px 22px}.editor-bar,.page{background:var(--paper)}.page{min-height:calc(100% - 59px)}</style></head><body><div class="app"><header class="top"><div class="brand"><span class="logo">Y</span> YOUNOTE</div><span class="top-link">知识库</span><span class="top-link">收藏</span><span class="top-link">备份与恢复</span><span class="spacer"></span><span class="demo">示例数据 · 本地原型</span><span class="muted">◉ &nbsp;我的空间</span></header><aside class="sidebar"><div class="brand"><span class="logo">Y</span> YOUNOTE</div><div class="side-item active">▦ <span>全部笔记</span><span class="count">5</span></div><div class="side-item">☆ <span>我的收藏</span><span class="count">2</span></div><div class="side-section caps">知识目录 <span style="float:right">＋</span></div><div class="side-item">▾ &nbsp;⌑ &nbsp;知识管理 <span class="count">1</span></div><div class="side-item">▸ &nbsp;⌑ &nbsp;个人成长 <span class="count">2</span></div><div class="side-item">▸ &nbsp;⌑ &nbsp;工作笔记 <span class="count">1</span></div><div class="side-item">▸ &nbsp;⌑ &nbsp;阅读摘录 <span class="count">1</span></div><div class="side-section caps">标签</div><div class="side-item"># &nbsp;方法论　<span class="count">1</span></div><div class="side-item"># &nbsp;知识管理　<span class="count">1</span></div><div class="side-item"># &nbsp;复盘　<span class="count">1</span></div><div class="sidebar-bottom"><div>↥ &nbsp;备份与恢复</div><div class="notice"><span class="dot"></span>AI 与索引未配置</div></div></aside><section class="list"><div class="list-header"><div class="eyebrow">YOUR KNOWLEDGE BASE</div><div class="list-title"><h2>全部笔记 <span class="muted tiny">5</span></h2><button class="add" title="新建笔记（展示）">＋</button></div><input class="search" placeholder="⌕  搜索笔记、标签..." aria-label="搜索笔记"></div><div class="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="favorite">☆ 收藏</button><span style="margin-left:auto">最近更新 ↓</span></div><div class="note-list"></div></section><main class="editor"><div class="editor-bar"><span class="muted tiny">知识库 <span style="padding:0 6px">/</span> <span class="current-folder">知识管理</span></span><div class="actions"><span class="save">已自动保存</span><button class="icon-btn star starred" aria-label="切换收藏">★</button><button class="icon-btn" title="更多（展示）">···</button></div></div><article class="page"><div class="breadcrumb">我的知识库　/　<span class="current-folder">知识管理</span>　/　笔记</div><h1 class="current-title"></h1><div class="metadata"><span>◷ 更新于 <span class="current-date"></span></span><span>·</span><span>示例笔记</span><span class="current-tags"></span></div><div class="rule"></div><div class="toolbar"><b>B</b><i>I</i><span>H₁</span><span>☷</span><span>❝</span><span>⌁</span><span style="margin-left:auto">正文可直接编辑</span></div><div class="content" contenteditable="true" aria-label="笔记正文"></div></article></main></div><script>const notes=[{title:'打造属于自己的知识系统',folder:'知识管理',date:'10月29日',tags:['方法论','知识管理'],excerpt:'从收集到连接，让知识真正成为自己的思考工具。',body:`<p class="lead">从收集到连接，让知识真正成为自己的思考工具。</p><h2>为什么需要一个知识系统？</h2><p>我们每天接触大量的信息，收藏很容易，但真正困难的是在需要的时候找到它、理解它，并把它应用到新的问题中。</p><blockquote>知识的价值，不在于拥有多少，而在于能否在恰当的时候调用。</blockquote><h2>我的实践原则</h2><ul><li><strong>先记录，再整理。</strong>降低捕捉想法的门槛，不让结构妨碍思考。</li><li><strong>建立连接。</strong>用自己的语言描述概念，让笔记之间产生关联。</li><li><strong>定期回顾。</strong>让沉淀的内容重新进入工作和生活。</li></ul><h2>下一步</h2><p>从一个真实的问题出发，持续积累，而不是追求一开始就建立完美的体系。</p>`},{title:'如何做好每周回顾',folder:'个人成长',date:'10月27日',tags:['复盘','习惯'],excerpt:'用三个问题，为下一周留出更清晰的空间。',body:`<p class="lead">用三个问题，为下一周留出更清晰的空间。</p><h2>回顾过去的一周</h2><p>整理完成的事情，记录值得庆祝的进展，也诚实面对没有达到预期的部分。</p><h2>三个问题</h2><ul><li>这周什么事情做得好？</li><li>什么事情消耗了不必要的精力？</li><li>下一周最重要的一件事是什么？</li></ul><blockquote>回顾不是为了评判自己，而是为了更好地前进。</blockquote>`},{title:'产品思考：从问题出发',folder:'工作笔记',date:'10月24日',tags:['产品','思考'],excerpt:'好的解决方案，始于对问题的准确描述。',body:`<p class="lead">好的解决方案，始于对问题的准确描述。</p><h2>先理解问题</h2><p>不要急于讨论功能，先观察用户的真实处境：他们想完成什么，在哪里遇到了阻碍？</p><h2>记录假设</h2><ul><li>明确目标用户和使用场景。</li><li>区分事实、推测和待验证的问题。</li><li>用最小的实验验证最重要的假设。</li></ul>`},{title:'阅读清单 · 2024',folder:'阅读摘录',date:'10月20日',tags:['阅读','清单'],excerpt:'那些值得慢慢读、反复思考的书。',body:`<p class="lead">那些值得慢慢读、反复思考的书。</p><h2>正在阅读</h2><ul><li>《思考，快与慢》</li><li>《置身事内》</li><li>《设计心理学》</li></ul><p>读完后写下自己的理解，比单纯摘录更重要。</p>`},{title:'一些关于专注的想法',folder:'个人成长',date:'10月18日',tags:['专注','随想'],excerpt:'给重要的事情留出不被打断的时间。',body:`<p class="lead">给重要的事情留出不被打断的时间。</p><h2>为专注创造条件</h2><p>关闭不必要的通知，把注意力放回眼前的工作。一次只做一件事，让思考有时间慢慢展开。</p><blockquote>专注是一种可以练习的能力。</blockquote>`}];let current=0,filter='all',favorites=new Set([0,1]), drafts={};const $=s=>document.querySelector(s);function renderList(){let q=$('.search').value.trim().toLowerCase();let list=notes.map((n,i)=>({n,i})).filter(({n,i})=>(filter==='all'||favorites.has(i))&&[n.title,n.folder,n.excerpt,...n.tags].join(' ').toLowerCase().includes(q));$('.note-list').innerHTML=list.length?list.map(({n,i})=>`<button class="note ${i===current?'active':''}" data-i="${i}"><div class="note-title"><span>${n.title}</span><span style="color:#d7a148">${favorites.has(i)?'★':''}</span></div><div class="note-excerpt">${n.excerpt}</div><div class="note-meta"><span>${n.folder} · ${n.date}</span><span># ${n.tags[0]}</span></div></button>`).join(''):'<div class="empty">没有找到匹配的笔记</div>';document.querySelectorAll('.note').forEach(b=>b.onclick=()=>show(+b.dataset.i))}function show(i){current=i;let n=notes[i];document.querySelectorAll('.current-folder').forEach(e=>e.textContent=n.folder);$('.current-title').textContent=n.title;$('.current-date').textContent=n.date;$('.current-tags').innerHTML=n.tags.map(t=>`<span class="tag"># ${t}</span>`).join(' ');$('.content').innerHTML=drafts[i]??n.body;$('.star').textContent=favorites.has(i)?'★':'☆';$('.star').classList.toggle('starred',favorites.has(i));let outline=document.querySelector('.outline');if(outline)outline.innerHTML=Array.from($('.content').querySelectorAll('h2')).map(h=>h.textContent).join('<br>');renderList()}$('.search').addEventListener('input',renderList);document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));renderList()});$('.star').onclick=()=>{favorites.has(current)?favorites.delete(current):favorites.add(current);show(current)};$('.content').addEventListener('input',()=>{drafts[current]=$('.content').innerHTML;$('.save').textContent='已保存于本页';});show(0);</script></body></html>
