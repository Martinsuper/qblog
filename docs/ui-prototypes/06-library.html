:root{--bg:#f2efe9;--ink:#243b45;--muted:#8b9697;--line:#dcded8;--accent:#b8864b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible{outline:2px solid #b8864b;outline-offset:4px}.rail{width:82px;position:fixed;inset:0 auto 0 0;background:#203944;color:#c7d0cf;display:flex;align-items:center;flex-direction:column;padding:30px 10px;gap:24px;z-index:5}.logo{font:30px Georgia;color:#e3cf9d;border:1px solid #728381;width:40px;height:43px;display:grid;place-items:center;border-radius:3px 12px 3px 3px}.rail a:last-child{margin-top:auto;writing-mode:vertical-rl;letter-spacing:3px;font-size:10px}.rail button{color:#cad5d1;font-size:10px;line-height:1.8;padding:10px 0;width:58px;border-radius:6px}.rail button.active{background:#ffffff12;color:#e0caa5}.rail-icon{font-size:24px;display:block;line-height:1.5}main{margin-left:82px;padding:0 62px 35px;max-width:1800px}.topbar{height:88px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{letter-spacing:4px;font-size:12px;font-weight:600}.brand small{font-size:10px;letter-spacing:1px;color:var(--muted);margin-left:16px;font-weight:400}.top-meta{font-size:10px;color:var(--muted);display:flex;gap:24px;align-items:center}.profile{width:29px;height:29px;border-radius:50%;background:#e1e3db;display:grid;place-items:center;color:#6b7e7f}.intro{display:flex;align-items:flex-end;justify-content:space-between;margin:36px 0 24px}.eyebrow{font:10px Georgia;letter-spacing:3px;color:#9b865f}h1{font:500 34px/1.5 "Songti SC",SimSun,serif;letter-spacing:2px;margin:9px 0 5px}.sub{font-size:12px;color:var(--muted)}.new-book{padding:9px 17px;border:1px solid #bfc9c7;border-radius:5px;font-size:12px}.section-title{displ :11px;width:100%;text-align:left;padding:13px 12px;border-radius:5px;margin-bottom:6px;font-size:11px;color:#657b7c}.chapter.active{background:#e6ece7;color:#304f55}.chapter-num{font:10px/2 Georgia;color:#a3ada3}.chapter small{display:block;font-size:9px;color:#99a39b;margin-top:3px}.add-note{border:1px dashed #c9d3c7;width:100%;padding:8px;border-radius:5px;font-size:11px;color:#789087;margin-top:18px}.reader{min-width:0}.reader-bar{display:flex;justify-content:space-between;align-items:center;height:56px;padding:0 30px;border-bottom:1px solid #edf0e8;font-size:10px;color:#8c9995}.reader-actions{display:flex;gap:17px;align-items:center}.edit{border:1px solid #dce3da;border-radius:4px;padding:4px 11px;color:#4d6e68}.article{padding:29px 50px 35px;max-width:900px;margin:auto}.article-kicker{font:9px Georgia;letter-spacing:3px;color:#a08a63}.article h2{font:27px/1.5 "Songti SC",SimSun,serif;letter-spacing:1px;margin:12px 0 9px}.meta{font-size:10px;color:#a0a99e;display:flex;gap:15px;margin-bottom:20px}.content{font:13px/2 "PingFang SC",sans-serif;color:#65776f;white-space:pre-wrap}.content:focus,.article h2:focus{outline:1px dashed #a4baaa;outline-offset:10px}.article blockquote{font:15px/1.9 "Songti SC",SimSun,serif;margin:20px 0 0;padding:14px 20px;border-left:2px solid #c0ab83;background:#f4f4eb;color:#879180}.bottom{display:flex;justify-content:space-between;font-size:10px;color:#9aa39a;margin-top:19px}.empty{padding:35px 14px;text-align:center;color:#8c9c90;font-size:12px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);border-radius:6px;background:#294b4d;color:#f2f4ef;padding:10px 20px;font-size:12px;z-index:10}.toast:empty{display:none}dialog{border:1px solid #d7dfd3;border-radius:8px;background:#fcfcf8;color:var(--ink);padding:27px;width:min(420px,90vw)}dialog::backdrop{background:#20394466;backdrop-filter:blur(3px)}dialog h2{font:24px "Songti SC",SimSun,serif;margin:0 0 20px}dialog label{font-size:12px;color:#7c8f85;display:block}dialog input{width:100%;padding:9px;margin:8px 0 22px;border:1px solid #d6dfd4;border-radius:4px;background:white}.dialog-actions{display:flex;justify-content:flex-end;gap:10px}.dialog-actions button{padding:7px 15px;border-radius:4px}.primary{background:#284a50;color:white}.focus .rail,.focus .intro,.focus .section-title,.focus .shelf,.focus .chapters{display:none}.focus main{margin:0;max-width:1000px;margin-inline:auto}.focus .workspace{display:block;margin-top:25px}.focus .article{padding-top:50px}.focus .article .content{min-height:310px}@media(min-width:1500px){.book{min-height:215px}.workspace{grid-template-columns:285px minmax(0,1fr)}.article{max-width:870px}}@media(max-width:1100px){main{padding-inline:30px}.shelf{gap:15px;padding-inline:0}.book{padding:19px 15px 18px 24px;min-height:175px}.book h2{font-size:21px}.workspace{grid-template-columns:210px minmax(0,1fr)}.article{padding:27px 30px}.brand small{display:none}}@media(max-width:720px){.rail{width:57px;padding-inline:4px;gap:15px}.logo{width:32px;height:35px;font-size:25px}.rail button{width:45px;font-size:9px}.rail-icon{font-size:21px}main{margin-left:57px;padding:0 17px 25px}.topbar{height:64px}.top-meta>span{display:none}.intro{margin-top:24px;gap:10px;align-items:center}h1{font-size:26px}.sub{font-size:10px}.new-book{font-size:10px;padding:6px 9px;white-space:nowrap}.shelf{grid-template-columns:repeat(2,minmax(0,1fr));gap:17px 13px}.book{min-height:160px}.book-count{margin-top:18px}.workspace{grid-template-columns:1fr}.chapters{border-right:0;border-bottom:1px solid var(--line);padding:14px}.chapter-list{display:flex;overflow:auto;gap:6px}.chapter{min-width:160px;margin:0;padding:9px}.chapter-heading{padding-bottom:10px}.search{padding-top:9px}.add-note{margin-top:10px}.article{padding:23px}.article h2{font-size:23px}.reader-bar{padding-inline:18px}.bottom{display:block}.bottom span{display:block}.focus main{padding-inline:20px}.focus .article{padding-inline:17px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><nav class="rail" aria-label="主导航"><a class="logo" href="index.html" title="返回方案总览">y</a><button class="active" id="books-view"><span class="rail-icon">▤</span>我的书架</button><button id="star-view"><span class="rail-icon">☆</span>收藏章节</button><a href="index.html">方案 F　／　返回设计总览</a></nav><main><header class="topbar"><div class="brand">YOUNOTE <small>笔记书架 / A PERSONAL LIBRARY</small></div><div class="top-meta"><span>少一些信息，多一些积累。</span><div class="profile">林</div></div></header><section class="intro"><div><div class="eyebrow">YOUR KNOWLEDGE, WELL KEPT.</div><h1>把积累，写成自己的书。</h1><div class="sub">每一个笔记本，都是一段值得持续的探索。</div></div><button class="new-book" id="new-book">＋ 新建笔记本</button></section><div class="section-title"><strong>我的书架 <span id="book-total">/ 04</span></strong><span>一本一主题，一页一所得</span></div><section class="shelf" id="shelf" aria-label="笔记本书架"></section><section class="workspace"><aside class="chapters"><div class="chapter-heading"><span id="book-name">设计与思考</span><span id="chapter-total"></span></div><label class="search">⌕ <input id="search" aria-label="搜索当前笔记本章节" placeholder="搜索本书章节…"></label><div class="chapter-list" id="chapters"></div><button class="add-note" id="add-note">＋ 添加一章笔记</button></aside><section class="reader"><header class="reader-bar"><span id="reader-crumb">CHAPTER 01</span><div class="reader-actions"><button id="star" aria-label="收藏章节" title="收藏章节">☆</button><button id="focus" aria-label="切换专注模式" title="切换专注模式">⛶</button><button class="edit" id="edit">编辑</button></div></header><article class="article" id="article"><div class="article-kicker">NOTES FROM MY LIBRARY</div><h2 id="title" contenteditable="false" aria-label="章节标题"></h2><div class="meta"><span id="updated"></span><span id="word-count"></span><span>私人笔记</span></div><div class="content" id="content" contenteditable="false" aria-label="章节正文"></div><blockquote>知识的意义，不在于收藏了多少，而在于它如何改变了你的思考。</blockquote></article></section></section><footer class="bottom"><span id="status">方案 F · 本地交互原型 · 保存仅限当前浏览器，不上传服务器</span><span>YOUNOTE / 笔记书架</span></footer></main><dialog id="book-dialog"><form id="book-form"><h2>开启一段新的探索</h2><label for="book-title">笔记本名称</label><input id="book-title" placeholder="例如：我的阅读地图" maxlength="24" required><div class="dialog-actions"><button type="button" id="cancel-book">取消</button><button class="primary" type="submit">创建笔记本</button></div></form></dialog><div class="toast" id="toast" role="status"></div><script>
'use strict';
const $=s=>document.querySelector(s),KEY='younote-library-v1';
const seed=[{id:'design',title:'设计与思考',en:'DESIGN & THINKING',color:'#314f59',notes:[{id:'d1',title:'设计，是把复杂变简单',body:'好的设计，往往藏在看不见的地方。\n\n当一个工具不再需要解释，当一次操作顺理成章，当用户的注意力全部留在内容上，设计才真正完成了它的使命。\n\n01　从使用者的真实需求开始\n不要急于添加功能，先问：这个人此刻想完成什么？\n\n02　让每一次选择，都少一点负担\n把主要操作放在稳定的位置，让次要信息安静退后。层级清楚，比装饰丰富更重要。\n\n03　给内容留出呼吸的空间\n留白不是浪费。它让信息之间的关系变得清楚，也让思考有机会发生。',star:true,date:'2026.10.29'},{id:'d2',title:'关于「笔记本」的隐喻',body:'为什么我们喜欢把笔记放进一本本书里？\n\n笔记本给零散的知识一个边界。它不像文件夹那么机械，也不像时间流那样容易消失。\n\n一个主题、一个封面、一组章节，带来一种缓慢积累的踏实感。\n\n这个设计更适合长期主题：一门课程、一个项目，或者一段人生阶段。',star:false,date:'2026.10.27'},{id:'d3',title:'减少界面中的噪声',body:'界面上每一个可见元素，都在消耗注意力。\n\n本周实践：\n· 删除首页的阅读量和热度排行。\n· 把发布流程改成保存笔记。\n· 用章节目录替代推荐文章。\n· 保持编辑与阅读的结构一致。',star:false,date:'2026.10.24'}]},{id:'tech',title:'技术备忘录',en:'ENGINEERING NOTES',color:'#767f64',notes:[{id:'t1',title:'理解 Vue 的响应式边界',body:'响应式是一种数据与视图之间的约定。\n\nref 适合基本类型，也适合需要整体替换的值；reactive 适合保持引用稳定的对象。\n\n把状态放在最靠近使用它的地方。当多个页面真正共享同一份状态时，再考虑全局 store。\n\n写组合式函数时，让输入、输出和副作用都保持清晰。',star:true,date:'2026.10.28'},{id:'t2',title:'一个可靠的笔记保存流程',body:'可靠的保存，不只是一次请求。\n\n1. 显示未保存状态。\n2. 保存时避免较早请求覆盖较新内容。\n3. 保存失败时保留编辑内容，提供重试。\n4. 本地草稿与服务器版本有明确边界。\n\n当前页面是原型，只保存到本地浏览器。',star:false,date:'2026.10.23'}]},{id:'reading',title:'阅读的回声',en:'READING JOURNAL',color:'#ae855c',notes:[{id:'r1',title:'读书，是与另一个自己相遇',body:'有些句子，读到的时候并不觉得特别。\n\n直到某个寻常的下午，生活中的一个片刻让它突然变得清晰。原来阅读种下的东西，会在很久以后才发芽。\n\n读书笔记不必复述整本书。记住一个触动你的问题，比抄下一整页结论更有意义。',star:false,date:'2026.10.26'}]},{id:'life',title:'生活观察簿',en:'THE ART OF EVERYDAY',color:'#8b716f',notes:[{id:'l1',title:'城市里的缓慢时刻',body:'今天换了一条路回家。\n\n路过一家开了很多年的修鞋店，门口的椅子被太阳晒得发亮。旁边的梧桐树掉了几片叶子，落在停着的自行车上。\n\n没有什么特别的事发生，但这些细小的观察，让一天变得具体。',star:false,date:'2026.10.25'}]}];
let books=seed;try{const s=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(s)&&s.length&&s.every(b=>b&&typeof b.id==='string'&&typeof b.title==='string'&&typeof b.color==='string'&&Array.isArray(b.notes)&&b.notes.every(n=>n&&typeof n.id==='string'&&typeof n.title==='string'&&typeof n.body==='string'&&typeof n.date==='string')))books=s}catch{}let bookId=books[0].id,noteId=books[0].notes[0]?.id,editing=false,starOnly=false,timer;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const book=()=>books.find(b=>b.id===bookId),note=()=>book().notes.find(n=>n.id===noteId);function toast(s){$('#toast').textContent=s;clearTimeout(timer);timer=setTimeout(()=>$('#toast').textContent='',2700)}function persist(){try{localStorage.setItem(KEY,JSON.stringify(books));$('#status').textContent='已保存到当前浏览器 · 本地交互原型，不上传服务器';return true}catch{$('#status').textContent='浏览器存储不可用 · 修改仅在当前页面保留';toast('浏览器存储不可用，请勿关闭页面');return false}}function setEditing(value){editing=value;$('#title').contentEditable=String(value);$('#content').contentEditable=String(value);$('#edit').textContent=value?'保存':'编辑'}function save(){if(!editing||!note())return;note().title=$('#title').textContent.trim()||'未命名章节';note().body=$('#content').innerText;note().date=new Date().toLocaleDateString('sv-SE').replaceAll('-','.');const ok=persist();setEditing(false);render();if(ok)toast('章节已保存到当前浏览器')}
function render(){const b=book();$('#shelf').innerHTML=books.map((b,i)=>`<button class="book ${b.id===bookId?'active':''}" data-book="${esc(b.id)}" aria-pressed="${b.id===bookId}" style="--cover:${/^#[0-9a-f]{6}$/i.test(b.color)?b.color:'#314f59'}"><span class="book-index">VOL. ${String(i+1).padStart(2,'0')}</span><h2>${esc(b.title)}</h2><div class="book-en">${esc(b.en||'MY PERSONAL NOTES')}</div><div class="book-count">${String(b.notes.length).padStart(2,'0')} 篇笔记　／　私人藏书</div></button>`).join('');$('#book-total').textContent='/ '+String(books.length).padStart(2,'0');$('#book-name').textContent=b.title;$('#chapter-total').textContent=starOnly?'收藏章节':b.notes.length+' 章节';const q=$('#search').value.toLowerCase(),list=b.notes.filter(n=>(!starOnly||n.star)&&(n.title+n.body).toLowerCase().includes(q));$('#chapters').innerHTML=list.length?list.map(n=>`<button class="chapter ${n.id===noteId?'active':''}" data-note="${esc(n.id)}"><span class="chapter-num">${String(b.notes.indexOf(n)+1).padStart(2,'0')}</span><div>${esc(n.title)}<small>${esc(n.date)}　${n.star?'★':''}</small></div></button>`).join(''):'<div class="empty">没有匹配的章节<br>试试其他关键词或添加一章。</div>';const n=note();$('#article').hidden=!n;$('#edit').disabled=!n;$('#star').disabled=!n;if(n){$('#title').textContent=n.title;$('#content').textContent=n.body;$('#updated').textContent='更新于 '+n.date;$('#word-count').textContent=n.body.replace(/\s/g,'').length+' 字';$('#reader-crumb').textContent='CHAPTER '+String(b.notes.indexOf(n)+1).padStart(2,'0')+'　/　'+b.title;$('#star').textContent=n.star?'★':'☆';$('#star').setAttribute('aria-pressed',String(n.star));$('#star').title=n.star?'取消收藏章节':'收藏章节';$('#star').setAttribute('aria-label',$('#star').title)}else $('#reader-crumb').textContent='尚无章节 · 添加一章开始记录';$('#books-view').classList.toggle('active',!starOnly);$('#star-view').classList.toggle('active',starOnly)}
$('#shelf').onclick=e=>{const b=e.target.closest('[data-book]');if(!b)return;save();bookId=b.dataset.book;$('#search').value='';noteId=book().notes.find(n=>!starOnly||n.star)?.id;render()};$('#chapters').onclick=e=>{const n=e.target.closest('[data-note]');if(n){save();noteId=n.dataset.note;render()}};$('#search').oninput=()=>{save();render()};$('#edit').onclick=()=>{if(editing)save();else{setEditing(true);$('#content').focus();$('#status').textContent='正在编辑 · 点击保存或按 Ctrl / ⌘ S 保存到本地'}};$('#star').onclick=()=>{save();note().star=!note().star;persist();render()};$('#add-note').onclick=()=>{save();const n={id:'n'+Date.now(),title:'未命名章节',body:'在这里开始新的积累……',star:false,date:new Date().toLocaleDateString('sv-SE').replaceAll('-','.')};book().notes.push(n);noteId=n.id;starOnly=false;$('#search').value='';persist();render();setEditing(true);$('#title').focus()};$('#new-book').onclick=()=>{save();$('#book-dialog').showModal();$('#book-title').focus()};$('#cancel-book').onclick=()=>$('#book-dialog').close();$('#book-form').onsubmit=e=>{e.preventDefault();const title=$('#book-title').value.trim();if(!title)return;save();const b={id:'b'+Date.now(),title,en:'MY PERSONAL NOTES',color:['#314f59','#767f64','#ae855c','#8b716f'][books.length%4],notes:[]};books.push(b);bookId=b.id;noteId=null;starOnly=false;$('#search').value='';persist();render();$('#book-dialog').close();$('#book-title').value='';toast('笔记本已创建，添加第一章笔记吧')};$('#books-view').onclick=()=>{save();starOnly=false;$('#search').value='';render()};$('#star-view').onclick=()=>{save();starOnly=true;$('#search').value='';const match=books.find(b=>b.notes.some(n=>n.star));if(match){bookId=match.id;noteId=match.notes.find(n=>n.star).id}render();toast('收藏模式：点击书架可查看各笔记本的收藏章节')};$('#focus').onclick=()=>{document.body.classList.toggle('focus');$('#focus').setAttribute('aria-pressed',String(document.body.classList.contains('focus')))};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}if(e.key==='Escape'){document.body.classList.remove('focus');$('#focus').setAttribute('aria-pressed','false')}});window.addEventListener('beforeunload',e=>{if(editing){e.preventDefault();e.returnValue=''}});render();
</script></body></html>
