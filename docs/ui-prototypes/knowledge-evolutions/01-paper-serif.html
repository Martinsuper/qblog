<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>演化 01 · 纸感衬线阅读</title><style>
/* 基于当前双栏骨架（目录树 + 正文）的纸感衬线演化：暖纸底、衬线正文、阅读进度条。 */
*{box-sizing:border-box}
:root{--bg:#f7f3ea;--rail:#f1ebdd;--panel:#fbf8f1;--ink:#3b332a;--muted:#8d8171;--line:#e3dac8;--accent:#9a5b3c;--accent-soft:#f0e2d4}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.9 Georgia,"Times New Roman","Songti SC","Noto Serif SC","STSong",serif;-webkit-font-smoothing:antialiased}
button{cursor:pointer;color:inherit;border:0;background:none;font:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:15px;height:15px;vertical-align:-2px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.muted{color:var(--muted)}
header{height:58px;display:flex;align-items:center;gap:22px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;letter-spacing:.5px;color:var(--ink);text-decoration:none}
.brand-mark{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:14px}
.brand small{font-size:11px;color:var(--muted);letter-spacing:.2em;margin-left:2px}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:0 14px;height:34px;min-width:260px;color:var(--muted)}
.search input{border:0;background:none;outline:none;width:100%;font:inherit;font-size:13px;color:var(--ink)}
.avatar{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px}
.app{height:calc(100dvh - 58px);display:grid;grid-template-columns:236px minmax(0,1fr)}
/* 目录栏：安静的纸色导轨 */
.sidebar{background:var(--rail);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;overflow:auto}
.section-label{font-size:11px;letter-spacing:.25em;color:var(--muted);margin:0 8px 12px;display:flex;align-items:center;gap:8px}
.section-label:after{content:"";flex:1;height:1px;background:var(--line)}
.tree-filter{margin:0 4px 10px}
.tree-filter input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:6px 12px;font:13px Georgia,"Songti SC",serif;color:var(--ink);outline:none}
.tree-group{margin:2px 4px 4px;font-size:11px;letter-spacing:.15em;color:var(--muted)}
.tree-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 10px;border-radius:6px;color:var(--ink);font-size:14px}
.tree-row:hover{background:var(--panel)}
.tree-row .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.55}
.tree-row .count{margin-left:auto;font-size:11px;color:var(--muted);font-family:Georgia,serif}
.tree-file{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 10px 5px 26px;border-radius:6px;color:#6c6152;font-size:13px;line-height:1.6}
.tree-file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-file:hover{color:var(--ink)}
.tree-file.selected{color:var(--accent);background:var(--accent-soft)}
.tree-file.selected:before{content:"—";margin-left:-18px;color:var(--accent);font-size:12px}
/* 正文：纸张 + 进度条 */
.reader{overflow:auto;background:var(--bg);position:relative;scroll-behavior:smooth}
.progress{position:sticky;top:0;z-index:3;height:3px;background:transparent}
.progress i{display:block;height:100%;width:0;background:var(--accent)}
.doc-crumb{position:sticky;top:3px;z-index:2;background:linear-gradient(var(--bg) 78%,transparent);padding:16px 40px 10px;font-size:12px;color:var(--muted);letter-spacing:.05em}
.doc-crumb b{color:var(--ink);font-weight:400}
.doc-head{max-width:720px;margin:6px auto 0;padding:0 40px}
.eyebrow{font-size:11px;letter-spacing:.3em;color:var(--accent);margin-bottom:14px}
.doc-head h1{font-size:30px;line-height:1.5;font-weight:600;letter-spacing:.02em;margin:0 0 14px}
.doc-meta{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:12px;color:var(--muted);padding-bottom:22px;border-bottom:1px solid var(--line);align-items:center}
.doc-meta .sep{color:var(--line)}
.star{color:var(--muted)}
.star.on{color:var(--accent)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:14px;padding:1px 9px;color:#7d7261;background:var(--panel)}
.doc{max-width:720px;margin:0 auto;padding:30px 40px 40px}
.markdown{font-size:15.5px;line-height:2.1}
.markdown p{margin:0 0 20px;text-align:justify}
.markdown h2{font-size:19px;font-weight:600;margin:34px 0 16px;padding-bottom:8px;border-bottom:1px solid var(--line);scroll-margin-top:70px}
.markdown h3{font-size:16px;font-weight:600;margin:26px 0 12px;scroll-margin-top:70px}
.markdown h2:first-child{margin-top:0}
.markdown strong{color:var(--accent)}
.markdown ul{padding-left:22px;margin:0 0 20px}
.markdown li{margin:7px 0}
.markdown blockquote{margin:24px 0;padding:4px 22px;border-left:2px solid var(--accent);color:#6d6355;font-style:italic;background:var(--panel);border-radius:0 8px 8px 0}
.markdown code{font:13px ui-monospace,Menlo,Consolas,monospace;background:var(--accent-soft);color:#7c4a30;border-radius:3px;padding:2px 6px}
.markdown pre{background:#2f2a22;color:#e8ddc8;border-radius:8px;padding:18px 20px;overflow:auto;margin:22px 0}
.markdown pre code{background:none;color:inherit;padding:0;line-height:1.8}
.markdown table{border-collapse:collapse;width:100%;font-size:13px;margin:20px 0 26px}
.markdown th{font-weight:600;text-align:left;border-bottom:1.5px solid var(--ink);padding:8px 10px}
.markdown td{border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:top}
.doc-end{max-width:720px;margin:0 auto;padding:18px 40px 60px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.rail{position:fixed;right:26px;top:130px;bottom:80px;width:180px;font-size:12px;color:var(--muted);overflow:auto}
.rail .rail-title{letter-spacing:.2em;font-size:10px;margin-bottom:12px}
.rail .toc{border-left:1px solid var(--line);padding-left:14px;display:flex;flex-direction:column;gap:9px}
.rail .toc button{text-align:left;color:inherit;padding:0}
.rail .toc button:hover{color:var(--accent)}
.rail .toc button.on{color:var(--accent)}
@media(max-width:1180px){.rail{display:none}}
@media(max-width:820px){.app{display:block}.sidebar{display:none}.doc-crumb,.doc-head,.doc,.doc-end{padding-left:22px;padding-right:22px}}
@media(prefers-reduced-motion:reduce){.reader{scroll-behavior:auto}}
</style></head><body>
<header>
  <a class="brand" href="#" onclick="return false"><span class="brand-mark">山</span>书山有路<small>知识库</small></a>
  <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="搜索整个知识库…" aria-label="搜索整个知识库"></label>
  <span class="avatar" title="工作区菜单">山</span>
</header>
<main class="app">
  <aside class="sidebar" aria-label="知识库导航">
    <div class="section-label">目 录</div>
    <div class="tree-filter"><input id="tq" type="search" placeholder="筛选目录…" aria-label="筛选目录"></div>
    <nav id="tree" aria-label="多级知识目录"></nav>
  </aside>
  <section class="reader" id="reader" aria-label="正文阅读区">
    <div class="progress" aria-hidden="true"><i id="pbar"></i></div>
    <div class="doc-crumb" id="crumb"></div>
    <div class="doc-head">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
      <div class="doc-meta" id="meta"></div>
    </div>
    <article class="doc"><div class="markdown" id="body"></div></article>
    <div class="doc-end"><span id="updated"></span><span>书山有路 · 演示原型</span></div>
  </section>
</main>
<nav class="rail" aria-label="本页目录"><div class="rail-title">本页目录</div><div class="toc" id="toc"></div></nav>
<script src="data.js"></script>
<script>
'use strict';
const notes = buildSeed();
let active = notes[0], favorite = new Set(notes.filter(n => n.favorite).map(n => n.id));
let treeQuery = '', query = '';
const $ = id => document.getElementById(id);

function filtered() { return query ? notes.filter(n => (n.title + n.summary + n.tags.join()).includes(query)) : notes; }
function inFolder(fid) { return filtered().filter(n => n.folder === fid); }

function buildTree() {
  const tree = $('tree'); tree.innerHTML = '';
  for (const g of FOLDERS) {
    const rows = g.children.flatMap(c => inFolder(c.id).map(n => ({ n, depth: c })));
    if (treeQuery && !rows.length) continue;
    const gl = document.createElement('div'); gl.className = 'tree-group'; gl.textContent = g.name; tree.appendChild(gl);
    for (const c of g.children) {
      const items = inFolder(c.id); if (!items.length && treeQuery) continue;
      const row = document.createElement('button'); row.className = 'tree-row'; row.type = 'button';
      row.innerHTML = '<span class="dot"></span>' + c.name + '<span class="count">' + items.length + '</span>';
      tree.appendChild(row);
      for (const n of items) {
        const f = document.createElement('button'); f.type = 'button'; f.className = 'tree-file' + (n.id === active.id ? ' selected' : '');
        f.textContent = n.title; f.onclick = () => { active = n; render(); };
        tree.appendChild(f);
      }
    }
  }
  const inbox = inFolder('inbox');
  if (inbox.length) {
    const gl = document.createElement('div'); gl.className = 'tree-group'; gl.textContent = '收件箱'; tree.appendChild(gl);
    for (const n of inbox) {
      const f = document.createElement('button'); f.type = 'button'; f.className = 'tree-file' + (n.id === active.id ? ' selected' : '');
      f.textContent = n.title; f.onclick = () => { active = n; render(); };
      tree.appendChild(f);
    }
  }
}

function render() {
  buildTree();
  const n = active;
  $('crumb').innerHTML = folderPath(n.folder) + ' <span class="muted">/</span> <b>' + n.title + '</b>';
  $('eyebrow').textContent = folderLabel(n.folder) + (n.source === 'mcp' ? ' · 来自 MCP 导入' : '');
  $('title').textContent = n.title;
  const fav = favorite.has(n.id);
  $('meta').innerHTML = '<span>' + shortDate(n.updated) + ' 更新</span><span class="sep">·</span>'
    + '<span>' + (n.source === 'mcp' ? '来源 ' + n.tool : '手动创建') + '</span><span class="sep">·</span>'
    + n.tags.map(t => '<span class="tag">' + t + '</span>').join('')
    + '<button class="star' + (fav ? ' on' : '') + '" id="starBtn" aria-label="收藏">' + (fav ? '★ 已收藏' : '☆ 收藏') + '</button>';
  $('starBtn').onclick = () => { favorite.has(n.id) ? favorite.delete(n.id) : favorite.add(n.id); render(); };
  $('body').innerHTML = renderMarkdown(n.body);
  $('updated').textContent = '最后更新于 ' + n.updated.slice(0, 10);
  const reader = $('reader'); reader.scrollTop = 0;
  const toc = $('toc'); toc.innerHTML = '';
  document.querySelectorAll('.markdown h2').forEach((h, i) => {
    h.id = 'h' + i;
    const b = document.createElement('button'); b.type = 'button'; b.textContent = h.textContent; b.className = i === 0 ? 'on' : '';
    b.onclick = () => { document.querySelectorAll('.toc button').forEach(x => x.classList.remove('on')); b.classList.add('on'); h.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    toc.appendChild(b);
  });
}

$('tq').addEventListener('input', e => { treeQuery = e.target.value.trim(); buildTree(); });
$('q').addEventListener('input', e => { query = e.target.value.trim(); render(); });
$('reader').addEventListener('scroll', () => {
  const r = $('reader');
  $('pbar').style.width = (r.scrollTop / Math.max(1, r.scrollHeight - r.clientHeight) * 100) + '%';
});
render();
</script>
</body></html>
