<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>演化 05 · 管理仪表盘</title><style>
/* 当前浅灰蓝视觉 + 管理向演化：目录树上新增「总览」，正文区支持仪表盘与阅读两种视图。 */
*{box-sizing:border-box}
:root{--bg:#f4f6f8;--panel:#fff;--ink:#243044;--muted:#7a8596;--line:#e5e9ef;--blue:#3564a9;--blue-bg:#eaf0f9;--soft:#f7f9fc;--green:#47816c;--amber:#a17c37;--red:#ac6570;--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.6 var(--font);-webkit-font-smoothing:antialiased}
button{cursor:pointer;color:inherit;border:0;background:none;font:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{width:15px;height:15px;vertical-align:-2px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
header{height:48px;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;letter-spacing:.3px;color:var(--ink);text-decoration:none}
.brand-mark{width:24px;height:24px;border-radius:6px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:13px}
.brand small{color:var(--muted);font-size:11px;font-weight:400}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;background:var(--soft);padding:0 12px;height:32px;width:min(340px,34vw);color:var(--muted)}
.search input{border:0;background:none;outline:none;width:100%;font-size:12px;color:var(--ink)}
.avatar{width:28px;height:28px;border-radius:50%;border:1px solid #dce4ee;background:#edf2f8;color:#45658d;display:grid;place-items:center;font-size:11px}
.app{height:calc(100dvh - 48px);display:grid;grid-template-columns:238px minmax(0,1fr)}
.sidebar{background:#f2f4f7;border-right:1px solid var(--line);padding:14px 10px;overflow:auto}
.section-label{font-size:10px;letter-spacing:.1em;color:#8a95a5;margin:0 8px 8px}
.nav-overview{display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 10px;border-radius:5px;font-size:12.5px;font-weight:600;color:var(--muted);text-align:left}
.nav-overview.active{background:var(--blue-bg);color:var(--blue)}
.nav-overview .count{margin-left:auto;font-size:10.5px;font-weight:400}
.tree-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 10px;border-radius:5px;color:var(--ink);font-size:12.5px;font-weight:550}
.tree-row:hover{background:var(--soft)}
.tree-row svg{color:#7790ae}
.tree-row .count{margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:400}
.tree-file{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:4px 10px 4px 26px;border-radius:5px;color:#5c6a7d;font-size:12px}
.tree-file svg{width:13px;height:13px;color:#8fa0b7}
.tree-file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-file:hover{background:var(--soft)}
.tree-file.selected{background:var(--blue-bg);color:var(--blue);font-weight:600}
.sidebar .divider{border-top:1px solid #e1e6ed;margin:10px 8px}
/* 正文区 */
.reader{overflow:auto;background:var(--bg);min-width:0}
.reader-toolbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;min-height:44px;padding:7px 24px;background:#f4f6f8ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.doc-crumb{font-size:12px;color:var(--muted);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.doc-crumb b{color:var(--ink)}
.btn{height:29px;padding:0 11px;border:1px solid var(--line);background:#fff;border-radius:5px;display:inline-flex;align-items:center;gap:6px;font-size:12px}
.icon-btn{width:28px;height:28px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:#edf1f6}
.icon-btn.on{color:#ae8848;background:#f8f3e9}
/* —— 仪表盘 —— */
.dash{max-width:1180px;margin:0 auto;padding:26px 30px 60px}
.dash h1{font-size:20px;font-weight:700;margin:0 0 4px}
.dash .sub{color:var(--muted);font-size:12.5px;margin:0 0 22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:15px 17px}
.stat .num{font-size:24px;font-weight:750;letter-spacing:-.5px}
.stat .lbl{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px}
.stat .lbl i{width:6px;height:6px;border-radius:50%;display:inline-block}
.stat.warn .num{color:var(--amber)}.stat.bad .num{color:var(--red)}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 18px;margin-bottom:12px}
.card h2{font-size:13px;font-weight:650;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between}
.card h2 .more{font-size:11px;color:var(--blue);font-weight:500}
.queue-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 6px;border-radius:5px;border-bottom:1px solid #eef2f6;font-size:12.5px}
.queue-item:last-child{border-bottom:0}
.queue-item:hover{background:var(--soft)}
.queue-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:5px;font-size:11px;flex-shrink:0}
.status:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.status.pending{color:var(--amber)}.status.failed{color:var(--red)}.status.indexed{color:var(--green)}
.pill{font-size:10px;border-radius:4px;padding:1px 6px;background:#edf2f7;color:#68768a;flex-shrink:0}
.pill.mcp{color:#5474a1;background:#edf2fa}
.recent-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 6px;border-radius:5px;font-size:12.5px}
.recent-item:hover{background:var(--soft)}
.recent-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent-item .d{font-size:10.5px;color:var(--muted);flex-shrink:0}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:88px minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:12px}
.bar-row .name{color:#5c6a7d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.bar-row .track{height:8px;border-radius:4px;background:#eef2f6;overflow:hidden}
.bar-row .track i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.bar-row .n{font-size:10.5px;color:var(--muted);text-align:right}
.tagcloud{display:flex;flex-wrap:wrap;gap:7px}
.tagcloud button{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:3px 12px;background:var(--soft);color:#5c6a7d}
.tagcloud button:hover{border-color:var(--blue);color:var(--blue)}
.tagcloud button s{text-decoration:none;color:var(--blue);font-weight:600;margin-left:4px}
.empty-hint{font-size:12px;color:var(--muted);line-height:1.9;padding:4px 2px}
/* —— 阅读视图 —— */
.reading{max-width:800px;margin:0 auto;padding:30px 40px 50px}
.eyebrow{font-size:10px;letter-spacing:.14em;color:#8496ae;text-transform:uppercase;margin-bottom:10px}
h1.doc-title{font-size:24px;font-weight:700;letter-spacing:-.4px;margin:0 0 12px}
.doc-properties{display:flex;flex-wrap:wrap;align-items:center;gap:9px;font-size:11px;color:#8a97a8;padding-bottom:18px;border-bottom:1px solid var(--line)}
.doc-properties .sep{color:#d5dce5}
.markdown{margin-top:20px;font-size:13.5px;line-height:2;color:#3b4a5e}
.markdown p{margin:0 0 16px}
.markdown h2{font-size:17px;font-weight:650;color:#2c3c52;margin:28px 0 13px;padding-bottom:7px;border-bottom:1px solid #e8edf3;scroll-margin-top:70px}
.markdown h3{font-size:14.5px;color:#33455c;font-weight:650;margin:21px 0 9px;scroll-margin-top:70px}
.markdown h2:first-child{margin-top:0}
.markdown strong{color:#31435c}
.markdown ul{padding-left:19px;margin:0 0 16px}
.markdown li{margin:5px 0}
.markdown blockquote{margin:18px 0;border-left:3px solid #9fb5d3;background:#f5f8fc;padding:11px 15px;font-size:12.5px;color:#647b99}
.markdown code{font:12px/1.7 ui-monospace,Menlo,monospace;background:#f0f3f7;border-radius:3px;padding:2px 5px;color:#526b8b}
.markdown pre{background:#f5f7fa;border:1px solid #e5eaf1;border-radius:6px;padding:16px;overflow:auto;margin:16px 0 20px}
.markdown pre code{background:none;padding:0;color:#57718e;line-height:1.85}
.markdown table{border-collapse:collapse;width:100%;font-size:12px;margin:16px 0 22px}
.markdown th{font-weight:600;background:#f3f6fa;color:#576b88;text-align:left}
.markdown th,.markdown td{border:1px solid #e1e7ef;padding:8px 12px;vertical-align:top}
.doc-end{max-width:800px;margin:0 auto;padding:14px 40px 40px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:11px;color:#97a3b2}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.dash-grid{grid-template-columns:1fr}}
@media(max-width:860px){.app{display:block}.sidebar{display:none}.dash{padding:20px 18px}.reading,.doc-end{padding-left:20px;padding-right:20px}.reader-toolbar{padding:6px 16px}}
</style></head><body>
<header>
  <a class="brand" href="#" onclick="return false"><span class="brand-mark">山</span>书山有路<small>知识库</small></a>
  <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="搜索整个知识库…" aria-label="搜索整个知识库"></label>
  <span class="avatar" title="工作区菜单">山</span>
</header>
<main class="app">
  <aside class="sidebar" aria-label="知识库导航">
    <div class="section-label">导航</div>
    <button class="nav-overview" id="navOverview" type="button">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>
      总览<span class="count" id="ovCount"></span>
    </button>
    <div class="divider"></div>
    <div class="section-label">目录</div>
    <nav id="tree" aria-label="多级知识目录"></nav>
  </aside>
  <section class="reader" aria-label="内容区">
    <div class="reader-toolbar" id="rt">
      <span class="doc-crumb" id="crumb"></span>
      <button class="icon-btn" id="starBtn" aria-label="收藏">☆</button>
      <button class="btn" id="backBtn" type="button">返回总览</button>
    </div>
    <div id="dashView">
      <div class="dash">
        <h1>知识库总览</h1>
        <p class="sub">管理大量笔记的入口：先看队列与分布，再进入具体目录。</p>
        <div class="stats" id="stats"></div>
        <div class="dash-grid">
          <div>
            <div class="card"><h2>索引队列<span class="more" id="queueMore"></span></h2><div id="queue"></div></div>
            <div class="card"><h2>最近更新</h2><div id="recent"></div></div>
          </div>
          <div>
            <div class="card"><h2>目录分布</h2><div class="bars" id="bars"></div></div>
            <div class="card"><h2>标签</h2><div class="tagcloud" id="tags"></div></div>
            <div class="card"><h2>收件箱提醒</h2><div class="empty-hint" id="inboxHint"></div></div>
          </div>
        </div>
      </div>
    </div>
    <div id="readView" hidden>
      <div class="reading">
        <div class="eyebrow" id="eyebrow"></div>
        <h1 class="doc-title" id="title"></h1>
        <div class="doc-properties" id="meta"></div>
        <div class="markdown" id="body"></div>
      </div>
      <div class="doc-end"><span id="updated"></span><span>书山有路 · 演示原型</span></div>
    </div>
  </section>
</main>
<script src="data.js"></script>
<script>
'use strict';
const notes = buildSeed();
let mode = 'dash', active = null;
let favorite = new Set(notes.filter(n => n.favorite).map(n => n.id));
let query = '';
const $ = id => document.getElementById(id);
$('ovCount').textContent = notes.length + ' 篇';

function filtered() { return query ? notes.filter(n => (n.title + n.summary + n.tags.join()).includes(query)) : notes; }
function inFolder(fid) { return filtered().filter(n => n.folder === fid); }
function tagCounts() { const m = {}; notes.forEach(n => n.tags.forEach(t => m[t] = (m[t] || 0) + 1)); return Object.entries(m).sort((a, b) => b[1] - a[1]); }

function buildTree() {
  const tree = $('tree'); tree.innerHTML = '';
  for (const g of FOLDERS) {
    const count = g.children.reduce((s, c) => s + inFolder(c.id).length, 0);
    if (!count && query) continue;
    const row = document.createElement('button'); row.type = 'button'; row.className = 'tree-row';
    row.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>' + g.name + '<span class="count">' + count + '</span>';
    tree.appendChild(row);
    for (const c of g.children) {
      const items = inFolder(c.id); if (!items.length) continue;
      const label = document.createElement('div');
      label.style.cssText = 'margin:8px 8px 2px;font-size:10.5px;color:#8a95a5';
      label.textContent = c.name;
      tree.appendChild(label);
      for (const n of items) {
        const f = document.createElement('button'); f.type = 'button'; f.className = 'tree-file' + (active && mode === 'read' && n.id === active.id ? ' selected' : '');
        f.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6Z"/></svg><span>' + n.title + '</span>';
        f.onclick = () => openNote(n);
        tree.appendChild(f);
      }
    }
  }
  const inbox = inFolder('inbox');
  if (inbox.length) {
    const label = document.createElement('div');
    label.style.cssText = 'margin:12px 8px 2px;font-size:10.5px;color:#8a95a5';
    label.textContent = '收件箱 · ' + inbox.length;
    tree.appendChild(label);
    for (const n of inbox) {
      const f = document.createElement('button'); f.type = 'button'; f.className = 'tree-file' + (active && mode === 'read' && n.id === active.id ? ' selected' : '');
      f.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6Z"/></svg><span>' + n.title + '</span>';
      f.onclick = () => openNote(n);
      tree.appendChild(f);
    }
  }
}

function renderDash() {
  const pend = notes.filter(n => n.status === 'pending'), fail = notes.filter(n => n.status === 'failed');
  $('stats').innerHTML = [
    ['<span style="color:var(--blue)">总笔记数</span>', notes.length, ''],
    ['<span style="color:var(--green)">已索引</span>', notes.filter(n => n.status === 'indexed').length, ''],
    ['<span style="color:var(--amber)">待索引</span>', pend.length, 'warn'],
    ['<span style="color:var(--red)">索引失败</span>', fail.length, 'bad'],
  ].map(s => '<div class="stat ' + s[2] + '"><div class="num">' + s[1] + '</div><div class="lbl"><i></i>' + s[0] + '</div></div>').join('');
  const queue = fail.concat(pend);
  $('queueMore').textContent = queue.length ? queue.length + ' 条需要处理' : '队列为空';
  $('queue').innerHTML = queue.length ? queue.map(n =>
    '<button class="queue-item" type="button" data-id="' + n.id + '"><span class="status ' + n.status + '">' + (n.status === 'failed' ? '失败' : '待索引') + '</span>'
    + '<span class="t">' + n.title + '</span><span class="pill mcp">' + (n.tool || '手动') + '</span></button>').join('')
    : '<div class="empty-hint">所有笔记都已索引完成。</div>';
  $('queue').querySelectorAll('button[data-id]').forEach(b => b.onclick = () => openNote(notes.find(n => n.id === b.dataset.id)));
  const recent = notes.slice().sort((a, b) => b.updated.localeCompare(a.updated)).slice(0, 8);
  $('recent').innerHTML = recent.map(n =>
    '<button class="recent-item" type="button" data-id="' + n.id + '"><span class="t">' + n.title + '</span>'
    + (favorite.has(n.id) ? '<span class="pill" style="background:#f8f3e9;color:#ae8848">★</span>' : '')
    + '<span class="d">' + shortDate(n.updated) + '</span></button>').join('');
  $('recent').querySelectorAll('button[data-id]').forEach(b => b.onclick = () => openNote(notes.find(n => n.id === b.dataset.id)));
  const dist = FOLDERS.map(g => ({ name: g.name, n: g.children.reduce((s, c) => s + notes.filter(x => x.folder === c.id).length, 0) }));
  dist.push({ name: '收件箱', n: notes.filter(x => x.folder === 'inbox').length });
  const max = Math.max.apply(null, dist.map(d => d.n));
  $('bars').innerHTML = dist.map(d => '<div class="bar-row"><span class="name">' + d.name + '</span><span class="track"><i style="width:' + Math.round(d.n / max * 100) + '%"></i></span><span class="n">' + d.n + '</span></div>').join('');
  const tc = tagCounts().slice(0, 12);
  $('tags').innerHTML = tc.map(t => '<button type="button" data-tag="' + t[0] + '">' + t[0] + '<s>' + t[1] + '</s></button>').join('');
  $('tags').querySelectorAll('button[data-tag]').forEach(b => b.onclick = () => { $('q').value = b.dataset.tag; query = b.dataset.tag; buildTree(); });
  const inboxN = notes.filter(n => n.folder === 'inbox');
  const manual = inboxN.filter(n => n.source === 'manual').length;
  $('inboxHint').innerHTML = '收件箱共有 <b>' + inboxN.length + '</b> 篇待整理笔记（MCP 导入 ' + (inboxN.length - manual) + ' 篇，手动 ' + manual + ' 篇）。<br>建议每周固定时间清空：删除重复、补齐来源、确认目录归属。';
}

function openNote(n) {
  active = n; mode = 'read';
  $('dashView').hidden = true; $('readView').hidden = false;
  render();
  document.querySelector('.reader').scrollTop = 0;
}
function goDash() {
  mode = 'dash';
  $('readView').hidden = true; $('dashView').hidden = false;
  render();
  document.querySelector('.reader').scrollTop = 0;
}

function render() {
  buildTree();
  $('navOverview').classList.toggle('active', mode === 'dash');
  $('backBtn').style.display = mode === 'read' ? '' : 'none';
  $('starBtn').style.display = mode === 'read' ? '' : 'none';
  $('crumb').innerHTML = mode === 'dash'
    ? '<b>总览</b> · 队列、分布与最近动态'
    : folderPath(active.folder) + ' · <b>' + active.title + '</b>';
  if (mode === 'dash') { renderDash(); return; }
  const n = active, fav = favorite.has(n.id);
  $('eyebrow').textContent = folderLabel(n.folder) + (n.source === 'mcp' ? ' · MCP 导入' : '');
  $('title').textContent = n.title;
  const st = { indexed: '已索引', pending: '待索引', failed: '索引失败' }[n.status];
  $('meta').innerHTML = '<span>' + shortDate(n.updated) + ' 更新</span><span class="sep">·</span>'
    + '<span class="status ' + n.status + '">' + st + '</span>'
    + '<span class="pill' + (n.source === 'mcp' ? ' mcp' : '') + '">' + (n.source === 'mcp' ? 'MCP · ' + n.tool : '手动创建') + '</span>'
    + n.tags.map(t => '<span class="pill">' + t + '</span>').join('');
  $('body').innerHTML = renderMarkdown(n.body);
  $('updated').textContent = '最后更新于 ' + n.updated.slice(0, 10);
  const sb = $('starBtn'); sb.textContent = fav ? '★' : '☆'; sb.classList.toggle('on', fav);
  sb.onclick = () => { favorite.has(n.id) ? favorite.delete(n.id) : favorite.add(n.id); render(); };
}

$('navOverview').onclick = goDash;
$('backBtn').onclick = goDash;
$('q').addEventListener('input', e => {
  query = e.target.value.trim();
  if (query && mode === 'dash') { mode = 'read'; $('dashView').hidden = true; $('readView').hidden = false; active = filtered()[0] || active; }
  if (!query) { mode = 'dash'; $('readView').hidden = true; $('dashView').hidden = false; }
  render();
});
render();
</script>
</body></html>
